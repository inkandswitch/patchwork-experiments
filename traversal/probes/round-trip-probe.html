<!doctype html>
<meta charset="utf-8">
<title>round trip probe</title>
<!-- Driven by probes/round-trip.mjs. The BUILT scene tool with the BUILT walk
     and traversal plugins in a stub registry, on REAL Automerge documents (one
     peer of probes/real-repo.js). Nothing here imports another package: each
     package's built dist is loaded as its plugins.

     The page is a small shell: it shows one scene doc at a time in #view, and
     a `patchwork:open-document` event reaching the document is recorded and,
     when `follow` is on, opens that doc there, as Patchwork does (the stage
     that sent it is unmounted, its cleanup run, and the other mounted fresh).

     Two plain scenes, made here: each a floor (a GLB box in a file doc), a
     spawn point (walk.spawn) that its view.start walks people in at, and a door
     carrying traversal.exit, with no `to`. B is A turned a quarter: its spawn
     and door are on the x axis, so arriving is told apart from not moving.
     The stage runs on a manual clock (scene's manualTime, window.__time):
     nothing in it moves until the probe steps it. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "../node_modules/@automerge/automerge/dist/mjs/entrypoints/fullfat_base64.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  #view { position: relative; width: 1100px; height: 640px; overflow: hidden; }
</style>
<div id="view"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { twoPeers } from "./real-repo.js";
import { emptyScene, DEFAULT_VIEW } from "./empty-scene.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

const EXIT = "traversal.exit";
const apply = (m, p) => [0, 1, 2].map((r) => m[r] * p[0] + m[4 + r] * p[1] + m[8 + r] * p[2] + m[12 + r]);

/** A box standing on y = 0, centred on x/z, as a one-mesh GLB (positions, normals, indices, one colour). */
function boxGLB([w, h, d], [r, g, b]) {
  const x = w / 2, z = d / 2;
  const faces = [
    [[1, 0, 0], [[x, 0, z], [x, 0, -z], [x, h, -z], [x, h, z]]],
    [[-1, 0, 0], [[-x, 0, -z], [-x, 0, z], [-x, h, z], [-x, h, -z]]],
    [[0, 1, 0], [[-x, h, z], [x, h, z], [x, h, -z], [-x, h, -z]]],
    [[0, -1, 0], [[-x, 0, -z], [x, 0, -z], [x, 0, z], [-x, 0, z]]],
    [[0, 0, 1], [[-x, 0, z], [x, 0, z], [x, h, z], [-x, h, z]]],
    [[0, 0, -1], [[x, 0, -z], [-x, 0, -z], [-x, h, -z], [x, h, -z]]],
  ];
  const pos = [], nor = [], idx = [];
  for (const [n, cs] of faces) {
    const k = pos.length / 3;
    for (const c of cs) pos.push(...c), nor.push(...n);
    idx.push(k, k + 1, k + 2, k, k + 2, k + 3);
  }
  const P = new Float32Array(pos), N = new Float32Array(nor), I = new Uint16Array(idx);
  const bin = new Uint8Array(P.byteLength + N.byteLength + I.byteLength);
  bin.set(new Uint8Array(P.buffer), 0);
  bin.set(new Uint8Array(N.buffer), P.byteLength);
  bin.set(new Uint8Array(I.buffer), P.byteLength + N.byteLength);
  const lo = [Math.min(...pos.filter((_, i) => i % 3 === 0)), 0, Math.min(...pos.filter((_, i) => i % 3 === 2))];
  const hi = [Math.max(...pos.filter((_, i) => i % 3 === 0)), h, Math.max(...pos.filter((_, i) => i % 3 === 2))];
  const json = JSON.stringify({
    asset: { version: "2.0" },
    scene: 0, scenes: [{ nodes: [0] }], nodes: [{ mesh: 0 }],
    materials: [{ pbrMetallicRoughness: { baseColorFactor: [r, g, b, 1], metallicFactor: 0, roughnessFactor: 0.8 }, doubleSided: true }],
    meshes: [{ primitives: [{ attributes: { POSITION: 0, NORMAL: 1 }, indices: 2, material: 0 }] }],
    accessors: [
      { bufferView: 0, componentType: 5126, count: P.length / 3, type: "VEC3", min: lo, max: hi },
      { bufferView: 1, componentType: 5126, count: N.length / 3, type: "VEC3" },
      { bufferView: 2, componentType: 5123, count: I.length, type: "SCALAR" },
    ],
    bufferViews: [
      { buffer: 0, byteOffset: 0, byteLength: P.byteLength, target: 34962 },
      { buffer: 0, byteOffset: P.byteLength, byteLength: N.byteLength, target: 34962 },
      { buffer: 0, byteOffset: P.byteLength + N.byteLength, byteLength: I.byteLength, target: 34963 },
    ],
    buffers: [{ byteLength: bin.byteLength }],
  });
  const jb = new TextEncoder().encode(json + " ".repeat((4 - (json.length % 4)) % 4));
  const out = new Uint8Array(12 + 8 + jb.length + 8 + bin.length);
  const dv = new DataView(out.buffer);
  dv.setUint32(0, 0x46546c67, true); dv.setUint32(4, 2, true); dv.setUint32(8, out.length, true);
  dv.setUint32(12, jb.length, true); dv.setUint32(16, 0x4e4f534a, true); out.set(jb, 20);
  const o = 20 + jb.length;
  dv.setUint32(o, bin.length, true); dv.setUint32(o + 4, 0x004e4942, true); out.set(bin, o + 8);
  return out;
}

try {
  for (const url of ["../../scene/dist/index.js", "../../walk/dist/index.js", "../dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  const time = (window.__time = (await (await import("../../scene/dist/index.js")).loadTime()).manualTime());
  const net = twoPeers({ delay: 25, later: (ms, fn) => time.after(ms, fn) }); // the network on the page's clock too
  const repo = net.a;
  const vi = await repo.create2({ "@patchwork": { type: "contact" }, name: "Vi" });
  const file = (name, bytes) => repo.create2({ "@patchwork": { type: "file" }, name, extension: "glb", mimeType: "model/gltf-binary", content: bytes });
  const DOOR_GLB = await file("door.glb", boxGLB([1.2, 2.2, 0.2], [0.8, 0.5, 0.2]));

  /**
   * A plain scene: a floor, a spawn point people start walking at, and a door
   * with an exit that has nowhere to go. `turn` is the quarter turn B has over A.
   */
  async function makeScene({ title, floor, spawn, door, yaw }) {
    const floorGLB = await file("floor.glb", boxGLB([14, 0.2, 14], floor));
    const obj = (name, extra) => ({ name, sourceUrl: null, providerId: null, renderUrl: null, parent: null, group: null, visible: true, color: null, opacity: 1, wireframe: false, transform: { position: [0, 0, 0], rotation: [0, 0, 0], scale: 1 }, ...extra });
    const glb = { providerId: "file-glb" };
    const objects = {
      floor: obj("Floor", { ...glb, sourceUrl: floorGLB.url, transform: { position: [0, -0.2, 0], rotation: [0, 0, 0], scale: 1 } }),
      spawn: obj("Start", { transform: { position: spawn, rotation: [0, yaw, 0], scale: 1 }, traits: { "walk.spawn": {} } }),
      door: obj("Door", { ...glb, sourceUrl: DOOR_GLB.url, transform: { position: door, rotation: [0, yaw, 0], scale: 1 }, traits: { [EXIT]: { verb: "Go through" } } }),
    };
    return repo.create2(emptyScene({ title, objects, order: Object.keys(objects), view: { ...DEFAULT_VIEW, grid: false, axes: false, start: { body: "walk", place: "spawn" } } }));
  }
  const A = await makeScene({ title: "Meadow", floor: [0.25, 0.6, 0.25], spawn: [0, 0, 4], door: [0, 0, -4], yaw: 0 });
  const B = await makeScene({ title: "Cellar", floor: [0.45, 0.4, 0.6], spawn: [4, 0, 0], door: [-4, 0, 0], yaw: Math.PI / 2 });
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const host = document.getElementById("view");
  host.repo = repo;
  host.time = time;

  // ─── the shell ─────────────────────────────────────────────────────────────
  let current = null; // { url, cleanup }
  const opened = []; // every open-document request that reached the document
  const shell = { follow: false };
  const handles = { [A.url]: A, [B.url]: B };
  const names = { [A.url]: "a", [B.url]: "b" };
  function show(which) {
    if (current) {
      current.cleanup?.();
      host.replaceChildren();
    }
    const h = which === "a" ? A : B;
    host.viewerId = vi.url;
    current = { url: h.url, cleanup: Tool(h, host), handle: h, told: [] };
    return h.url;
  }
  document.addEventListener("patchwork:open-document", (e) => {
    opened.push({ url: e.detail?.url ?? null, from: current?.url ?? null, detail: JSON.parse(JSON.stringify(e.detail ?? null)), bubbles: e.bubbles, composed: e.composed, at: Math.round(performance.now()) });
    if (shell.follow && handles[e.detail?.url]) setTimeout(() => show(names[e.detail.url]));
  });
  const dbg = () => host.querySelector(".scene-stage")?.__sceneDebug ?? null;
  const rootEl = () => host.querySelector(".scene-stage");
  // every notice the shown scene says, collected every frame (a notice lives 6 s of the page's clock)
  const collect = () => {
    time.frame(collect); // first: a pass that throws doesn't end the loop
    for (const n of dbg()?.view.plugins.instanceOf("scene.notices")?.notices ?? []) {
      const t = n.text ?? String(n);
      if (current && !current.told.includes(t)) current.told.push(t);
    }
  };
  time.frame(collect);
  const doc = () => current.handle.doc();
  const withTrait = (t) => Object.entries(doc().objects ?? {}).find(([, o]) => o.traits?.[t])?.[0] ?? null;

  const P = (window.__p = {
    errors, opened, shell, urls: { a: A.url, b: B.url },
    show,
    showing: () => names[current?.url] ?? null,
    forgetCameras() { try { localStorage.clear(); } catch {} return true; },
    running: () => (dbg()?.local.get().running ?? []).map((r) => r.id),
    /** the body on top of the shown scene's stack, by id */
    bodyId: () => dbg()?.local.get().body?.id ?? null,
    notices: () => [...(current?.told ?? [])],
    doc: () => JSON.parse(JSON.stringify(doc())),
    /** the shown scene's objects with content to load, and how many have */
    loaded() {
      const os = Object.entries(doc().objects ?? {}).filter(([, o]) => o.sourceUrl);
      return { total: os.length, loaded: os.filter(([id]) => dbg()?.viewport.contentOf(id)?.loaded).length };
    },
    withTrait,
    focus() { rootEl()?.focus(); return !!rootEl()?.contains(document.activeElement); },
    /** where an exit leads: its `to`, as the inspector's url field writes it (null: deleted, leading nowhere) */
    lead(which, url) {
      const h = which === "a" ? A : B;
      const id = Object.entries(h.doc().objects).find(([, o]) => o.traits?.[EXIT])?.[0];
      h.change((d) => { if (url) d.objects[id].traits[EXIT].to = url; else delete d.objects[id].traits[EXIT].to; });
      return id;
    },

    // ─── what a viewer sees ───────────────────────────────────────────────────
    /** the use prompt's verbs, as shown */
    prompt: () => [...host.querySelectorAll(".use-prompt:not([hidden]) .use-verb")].map((e) => e.textContent.trim().replace(/\s+/g, " ")),
    /** all the text the view shows (notices, labels, HUDs, prompts, buttons), as rendered */
    text: () => host.innerText,
    hovered: () => dbg()?.local.get().hovered ?? null,
    cam: () => dbg().viewport.getCamera(),
    yawPitch() {
      const c = dbg().viewport.getCamera();
      const d = [c.target[0] - c.position[0], c.target[1] - c.position[1], c.target[2] - c.position[2]];
      const l = Math.hypot(...d);
      return { yaw: Math.atan2(-d[0], -d[2]), pitch: Math.asin(d[1] / l) };
    },
    canvasRect() { const r = dbg().viewport.canvas.getBoundingClientRect(); return { x: r.left, y: r.top, w: r.width, h: r.height }; },
    /** the body on top of the stack, its stack and the held tool's command (scene/TOOLS.md §4) */
    body: () => ({ id: dbg().local.get().body?.id ?? null, stack: dbg().router.bodies().map((b) => b.id), tool: dbg().local.get().held?.at(-1)?.command ?? null }),
    /** an object's world matrix as drawn */
    worldOf: (id) => { const m = dbg().viewport.worldOf(id); return m ? [...m] : null; },
    /**
     * A page point over object `id` (near `local` in its frame), where a pick
     * hits it: spiralling out from the point's projection until one does.
     */
    aimAt(id, local = [0, 0, 0]) {
      const v = dbg().viewport;
      const r = v.canvas.getBoundingClientRect();
      const m = v.worldOf(id);
      const p0 = m && v.project(apply(m, local));
      if (!p0) return null;
      for (let k = 0; k < 900; k++) {
        const a = k * 0.6, rad = 1.5 * Math.sqrt(k);
        const x = p0.x + rad * Math.cos(a), y = p0.y + rad * Math.sin(a);
        if (x < 2 || y < 2 || x > r.width - 2 || y > r.height - 2) continue;
        const hit = v.pick(x, y);
        if (hit?.id === id) return { x: r.left + x, y: r.top + y, distance: +hit.distance.toFixed(3) };
      }
      return null;
    },
  });
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack ?? err}`);
  window.__ready = "failed";
  window.__p = { errors };
}
</script>
