<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The relay observatory · Ink Studio</title>
<style>:root{color-scheme:dark;background:#07131d;color:#cfebe2;font-family:system-ui}body{margin:0;padding:26px}main{max-width:1100px;margin:auto}h1{font:400 28px Georgia;margin:0 0 8px}p,output{color:#7ea8b2;font-size:13px}canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none;border:1px solid #22404e;border-radius:6px}nav{display:flex;flex-wrap:wrap;align-items:center;gap:15px;margin:16px 0;font-size:12px}button{border:1px solid #3e6268;background:#142f3c;color:#bde8d8;padding:7px 13px;border-radius:4px;cursor:pointer}input{accent-color:#86d2c5}</style>
<main><h1>The relay observatory</h1><p>Three live targets. One shared inspection layer. Drag to orbit; scroll to zoom.</p><canvas id="view"></canvas><nav><button id="pause">Pause</button><button id="reset">Reset view</button><label>Focus <select id="focus"><option>CORE</option><option>ARCHIVE</option><option>PROBE</option></select></label><label><input id="enabled" type="checkbox" checked>Inspection</label><label><input id="magnify" type="checkbox" checked>Magnified view</label><label><input id="occlusion" type="checkbox" checked>Visibility checks</label><label><input id="hide" type="checkbox">Hide core inspection</label></nav><output id="status"></output></main>
<script src="../dist/ink-studio.browser.js"></script><script src="./target-inspection.js"></script><script type="module">
import {createRenderer} from '../webgl.mjs';
const kit={KIT,makeBuilder,makeSculpt,PixelLook,TexturedSurface,SpriteSurface,RenderStages},demo=inspectionScene(kit),{world}=demo,canvas=document.querySelector('#view'),renderer=createRenderer(canvas,{toolkit:kit}),camera={...world.cam};
let time=0,paused=false,last,drag,frames=0,stamp,fps=60;
for(const name of ['enabled','magnify','occlusion','hide'])document.querySelector('#'+name).onchange=e=>demo.options[name]=e.target.checked;
document.querySelector('#focus').onchange=e=>demo.options.focus=e.target.value;
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};document.querySelector('#reset').onclick=()=>Object.assign(camera,world.cam);
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,camera.yaw,camera.pitch];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){camera.yaw=drag[2]-(e.clientX-drag[0])*.006;camera.pitch=Math.max(-.2,Math.min(1.4,drag[3]+(e.clientY-drag[1])*.006));}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=Math.max(8,Math.min(30,camera.dist*Math.exp(e.deltaY*.001)));},{passive:false});
window.inspectionQA={demo,world,camera,renderer,get time(){return time;},seek(t){time=t;demo.setTime(t);},get paused(){return paused;},set paused(v){paused=v;}};
function tick(now){if(!paused)time+=last==null?0:Math.min(.04,(now-last)/1000);last=now;demo.setTime(time);renderer.render(world,{width:1056,height:600,time,camera,inspection:demo.definition(),inspectionFocus:demo.options.focus,damp:false,stepAnimation:false});stamp??=now;frames++;if(now-stamp>800){fps=Math.round(frames*1000/(now-stamp));stamp=now;frames=0;}document.querySelector('#status').value=`${world.count.toLocaleString()} splats · ${fps} fps · Target-linked glyph rings, depth visibility, labels and a clean-source magnifier`;requestAnimationFrame(tick);}requestAnimationFrame(tick);
</script></html>
