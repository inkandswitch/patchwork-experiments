<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The matter relay · Ink Studio</title>
<style>:root{color-scheme:dark;font-family:system-ui;background:#080f1b;color:#d3e8df}body{margin:0;padding:26px}main{max-width:1100px;margin:auto}h1{font:500 27px Georgia;margin:0 0 8px;color:#bfece0}p{font-size:13px;color:#7aa2b2}canvas{display:block;width:100%;image-rendering:pixelated;touch-action:none;border:1px solid #233e51;border-radius:7px}nav{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin:16px 0;font-size:12px}button,select{border:1px solid #365b71;background:#14243a;color:#bfece0;border-radius:4px;padding:7px 11px;cursor:pointer}button.warm{border-color:#8e674e;color:#ffcf89}output{font-size:12px;line-height:1.8;color:#7aa2b2}span.sep{margin-left:10px}</style>
<main><h1>The matter relay</h1><p>Surface → wind → manta → iris → animated sculpture. Drag to orbit; scroll to zoom.</p><canvas id="view"></canvas><nav><button id="pause">Pause</button><button id="play">Play cycle</button><span class="sep"></span><button id="drift">Release</button><button id="manta">Gather manta</button><button id="iris" class="warm">Gather iris</button><button id="home">Rejoin body</button><button id="dissolve">Dissolve</button><span class="sep"></span><button id="save">Save state</button><button id="restore">Restore</button><button id="reset">Reset</button><select id="speed"><option value="1">1×</option><option value=".5">½×</option><option value="2">2×</option></select></nav><output id="status"></output></main>
<script src="../dist/ink-studio.browser.js"></script><script src="./materialisation.js"></script><script type="module">
import {createRenderer} from '../webgl.mjs';
const kit={makeBuilder,makeSculpt,KIT,TexturedSurface,SpriteSurface,PixelLook,RenderStages},scene=materialisationScene(kit),world=scene.build(scene.seed),demo=world.materialisationDemo;
const canvas=document.querySelector('#view'),renderer=createRenderer(canvas,{toolkit:kit}),camera={...world.cam};let elapsed=0,last,paused=false,drag,frames=0,stamp,fps=60;
for(const id of ['drift','manta','iris','home','dissolve'])document.querySelector('#'+id).onclick=()=>demo.command(id);
for(const id of ['save','restore'])document.querySelector('#'+id).onclick=()=>demo[id]();document.querySelector('#reset').onclick=()=>{demo.reset();elapsed=0;};document.querySelector('#play').onclick=()=>{demo.play();elapsed=0;};
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,camera.yaw,camera.pitch];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){camera.yaw=drag[2]-(e.clientX-drag[0])*.006;camera.pitch=Math.max(.05,Math.min(1.3,drag[3]+(e.clientY-drag[1])*.006));}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=Math.max(10,Math.min(28,camera.dist*Math.exp(e.deltaY*.001)));},{passive:false});
window.materialisationQA={world,demo,camera,renderer,get paused(){return paused;},set paused(value){paused=value;document.querySelector('#pause').textContent=paused?'Resume':'Pause';},seek(t){demo.reset();demo.fx.timeline(demo.story,{loop:15});demo.advance(t);elapsed=t;},get time(){return elapsed;}};
function frame(now){const dt=last===undefined?0:Math.min(.04,(now-last)/1000)*Number(document.querySelector('#speed').value);last=now;if(!paused){let remaining=dt;while(remaining>1e-8){const h=Math.min(.05,remaining);elapsed+=h;demo.stage.update(h,elapsed);remaining-=h;}}
  const changedRows=[];for(let i=0;i<demo.stage.rows.length;i++)if(demo.stage.rows[i]){changedRows.push(i);demo.stage.rows[i]=0;}
  renderer.render(world,{changedRows,width:1056,height:600,time:demo.fx.stats.time,camera,damp:false,stepAnimation:false});stamp??=now;frames++;if(now-stamp>750){fps=Math.round(frames*1000/(now-stamp));frames=0;stamp=now;}
  const s=demo.fx.stats;document.querySelector('#status').value=`${(s.home+s.waiting).toLocaleString()} attached · ${(s.drifting+s.gathering).toLocaleString()} in flight · ${s.settled.toLocaleString()} gathered · ${s.hidden.toLocaleString()} hidden — ${fps} fps`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
