<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The remembering garden · Ink Studio</title>
<style>:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#112a2d;color:#e1dbac}body{margin:0}main{max-width:1200px;margin:auto;padding:20px}h1{font-size:22px;margin:0 0 5px}p{font-size:14px;color:#99b8a1;margin:0 0 15px}canvas{display:block;width:100%;aspect-ratio:16/10;image-rendering:pixelated;touch-action:none;border-radius:8px}nav{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:12px}button,select{font:inherit;padding:9px 13px;border:1px solid #62874e;background:#21443f;color:#e1dbac;border-radius:5px}button:hover{background:#39634c}#ignite{background:#8d7045;border-color:#c79d5c}output{font-size:13px;color:#99b8a1}label{font-size:13px}</style>
<main><h1>The remembering garden</h1><p>One habitat. Textured earth and splat foliage share fire, water and new growth. Drag to orbit · scroll to zoom.</p><canvas id="view" width="960" height="600" aria-label="Interactive ecological garden"></canvas>
<nav><button id="ignite">Ignite meadow</button><button id="water">Water & recover</button><button id="moss">Seed moss</button><button id="save">Save state</button><button id="restore">Restore</button><button id="reset">Reset</button><button id="pause">Pause</button><label>Speed <select id="speed"><option value="1">1×</option><option value="3">3×</option><option value="5">5×</option></select></label><output id="status">Growing the garden…</output></nav></main>
<script src="../dist/ink-studio.browser.js"></script><script src="./ecology.js"></script>
<script type="module">
import {createRenderer} from '../webgl.mjs';
const kit={makeBuilder,makeSculpt,KIT,TexturedSurface,SpriteSurface,PixelLook},scene=ecologyScene(kit),world=scene.build(scene.seed),demo=world.ecologyDemo;
const canvas=document.querySelector('#view'),renderer=createRenderer(canvas,{toolkit:kit}),camera={...world.cam,ortho:true};
let elapsed=0,last,paused=false,drag;
for(const [id,method]of [['ignite','ignite'],['water','water'],['moss','seedMoss'],['save','save'],['restore','restore'],['reset','reset']])document.querySelector('#'+id).onclick=()=>demo[method]();
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,camera.yaw,camera.pitch];canvas.setPointerCapture(e.pointerId);};canvas.onpointermove=e=>{if(drag){camera.yaw=drag[2]-(e.clientX-drag[0])*.006;camera.pitch=Math.max(.12,Math.min(1.3,drag[3]+(e.clientY-drag[1])*.006));}};canvas.onpointerup=canvas.onpointercancel=()=>drag=null;
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=Math.max(13,Math.min(40,camera.dist*Math.exp(e.deltaY*.001)));},{passive:false});
window.ecologyQA={world,demo,camera,renderer,get paused(){return paused;},set paused(value){paused=value;}};
function frame(now){const dt=last===undefined?0:Math.min(.05,(now-last)/1000)*Number(document.querySelector('#speed').value);last=now;if(!paused){let remaining=dt;while(remaining>1e-8){const h=Math.min(.05,remaining);elapsed+=h;world.anim.update(h,elapsed);remaining-=h;}}
  renderer.render(world,{width:960,height:600,time:elapsed,camera,damp:false});
  let burning=0,scar=0,growth=0;for(let i=0;i<demo.sim.count;i++){burning+=demo.sim.read('burning',i)>.5;scar+=demo.sim.read('char',i)>.2;growth+=demo.sim.read('growth',i)>.2;}
  document.querySelector('#status').value=`${burning} burning · ${scar} marked · ${growth} regrowing · ${demo.binding.lights.length} lights`;requestAnimationFrame(frame);}
requestAnimationFrame(frame);
</script></html>
