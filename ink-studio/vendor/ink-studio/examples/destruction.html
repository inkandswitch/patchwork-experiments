<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>The siege garden · Ink Studio</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#121f2a;color:#f4dca0}body{margin:0}main{max-width:1200px;margin:auto;padding:22px}h1{font-size:22px;margin:0 0 5px}p{color:#91b1ae;font-size:14px;margin:0 0 16px}canvas{display:block;width:100%;aspect-ratio:16/10;image-rendering:pixelated;touch-action:none;cursor:grab;border-radius:8px;background:#121f2a}.controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:14px 0}button,select{font:inherit;padding:10px 16px;border:1px solid #66848c;border-radius:6px;background:#23404c;color:#f4dca0}button:hover{background:#3c5e68}button:active{transform:translateY(1px)}#cannon{background:#927046;border-color:#c9a56b}output{font-size:13px;color:#91b1ae;font-variant-numeric:tabular-nums}label{font-size:14px}
</style>
<main>
<h1>The siege garden</h1>
<p>Break a support. Bring down the structure. Drag to orbit · scroll to zoom.</p>
<canvas id="view" width="960" height="600" aria-label="Interactive destructible stone tower and bridge"></canvas>
<div class="controls">
<button id="cannon">Fire cannon</button><button id="catapult">Launch catapult</button>
<label>Target <select id="target"><option value="auto">Tower / bridge</option><option value="tower">Tower</option><option value="bridge">Bridge</option></select></label>
<button id="reset">Rebuild</button><button id="pause">Pause</button>
<output id="status" aria-live="polite">Loading the garden…</output>
</div>
</main>
<script src="../dist/ink-studio.browser.js"></script>
<script src="./destruction.js"></script>
<script type="module">
import { createRenderer } from '../webgl.mjs';
const canvas=document.querySelector('#view'), status=document.querySelector('#status');
const scene=destructionScene({makeBuilder,makeSculpt,KIT}),world=scene.build(scene.seed),demo=world.destructionDemo;
const renderer=createRenderer(canvas,{toolkit:{KIT,PixelLook}}),camera={...world.cam,ortho:true};
let last,elapsed=0,paused=false,drag=null;
for(const kind of ['cannon','catapult'])document.querySelector('#'+kind).onclick=()=>{
  const target=document.querySelector('#target').value;
  demo.fire(kind,target==='auto'?undefined:target);
};
document.querySelector('#reset').onclick=()=>demo.reset();
document.querySelector('#pause').onclick=e=>{paused=!paused;e.target.textContent=paused?'Resume':'Pause';};
canvas.onpointerdown=e=>{drag=[e.clientX,e.clientY,camera.yaw,camera.pitch];canvas.setPointerCapture(e.pointerId);};
canvas.onpointermove=e=>{if(drag){camera.yaw=drag[2]-(e.clientX-drag[0])*.006;camera.pitch=Math.max(.12,Math.min(1.3,drag[3]+(e.clientY-drag[1])*.006));}};
canvas.onpointerup=canvas.onpointercancel=()=>{drag=null;};
canvas.addEventListener('wheel',e=>{e.preventDefault();camera.dist=Math.max(13,Math.min(45,camera.dist*Math.exp(e.deltaY*.001)));},{passive:false});
window.destructionQA={world,demo,camera,get paused(){return paused;},set paused(value){paused=value;}};
function frame(now){
  const dt=last===undefined?0:Math.min(.05,(now-last)/1000);last=now;
  if(!paused){elapsed+=dt;world.anim.update(dt,elapsed);}
  renderer.render(world,{width:960,height:600,time:elapsed,camera,damp:false});
  const p=demo.physics.stats;
  status.value=`${p.intact}/${p.groups} structures · ${p.pieces} pieces · ${p.projectiles} projectiles`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
</script>
</html>
