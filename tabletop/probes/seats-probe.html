<!doctype html>
<meta charset="utf-8">
<title>tabletop seats probe</title>
<!-- Driven by probes/seats.mjs. The BUILT scene tool (scene/dist) with the
     BUILT tabletop plugins (tabletop/dist) in a stub registry, on an
     in-memory repo, at a Lost Cities table set up as the game page does
     (src/setup.js). Two views of one doc, A (Ana) and B (Ben), each view's
     broadcasts (presence, poses) reaching only the other, a few ms late, until
     the runner cuts one off (cut('a')): a view whose network went, still
     running, still writing the doc. B mounts when the runner calls joinB(). -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  body { display: flex; gap: 8px; }
  #a, #b { width: 700px; height: 520px; flex: none; position: relative; }
</style>
<div id="a"></div><div id="b"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "./fake-repo.js";
import { fill } from "../src/games/lost-cities.js";
import { ensurePieceGLBs } from "../src/pieces.js";
import { tableLayout, writeTable } from "../src/setup.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

// Two views of one handle. A broadcast from one reaches the other only, 5 ms late, unless either is cut off.
function peer(handle) {
  const eph = new Set();
  const p = {
    url: handle.url,
    doc: () => handle.doc(),
    heads: () => handle.heads?.(),
    change: (fn) => handle.change(fn),
    on: (ev, fn) => (ev === "ephemeral-message" ? eph.add(fn) : handle.on(ev, fn)),
    off: (ev, fn) => (ev === "ephemeral-message" ? eph.delete(fn) : handle.off(ev, fn)),
    broadcast: (message) => setTimeout(() => {
      if (p.cut || p.other.cut) return;
      for (const fn of p.other.eph) fn({ message, senderId: "peer" });
    }, 5),
    eph,
    cut: false,
  };
  return p;
}

try {
  for (const url of ["../../scene/dist/index.js", "../dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  const repo = new FakeRepo();
  window.repo = repo;
  // the two players' contacts, so the name tags and notices can say who
  const ana = repo.add({ "@patchwork": { type: "contact" }, name: "Ana" });
  const ben = repo.add({ "@patchwork": { type: "contact" }, name: "Ben" });
  // Lost Cities, and a table set up from it (tool.js setUpTable)
  const game = repo.add({ "@patchwork": { type: "tabletop-game" }, title: "Lost Cities", about: "", pieces: {}, order: [], tables: [] });
  game.change((d) => fill(d));
  await ensurePieceGLBs(repo, game);
  // the game page's table (tool.js setUpTable): the game's GLBs, the decks first, then the scene
  const g = game.doc();
  const fileOf = (k) => (g.pieces[k]?.glbUrl ? { url: g.pieces[k].glbUrl, hint: g.pieces[k].bounds ? { bounds: g.pieces[k].bounds } : null } : null);
  const layout = tableLayout(g, { fileOf, gameUrl: game.url });
  const deckUrls = {};
  for (const [id, deck] of Object.entries(layout.decks)) deckUrls[id] = (await repo.create2(deck)).url;
  const table = { "@patchwork": { type: "scene" }, title: "Seats probe", objects: {}, order: [], dimensions: {}, assets: {}, traits: {}, view: {} };
  writeTable(table, layout, deckUrls);
  const scene = repo.add(table);
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const A = peer(scene), B = peer(scene);
  A.other = B; B.other = A;
  const peers = { a: A, b: B };
  const hostA = document.getElementById("a"), hostB = document.getElementById("b");
  hostA.repo = repo; hostB.repo = repo;
  hostA.viewerId = ana.url; hostB.viewerId = ben.url;
  const cleanups = { a: Tool(A, hostA), b: null };
  const dbg = { a: hostA.querySelector(".scene-stage").__sceneDebug, b: null };
  const hosts = { a: hostA, b: hostB };
  // every notice each view shows, kept (they expire)
  const told = { a: [], b: [] };
  setInterval(() => {
    for (const w of ["a", "b"]) for (const n of dbg[w]?.local.get().notices ?? []) if (!told[w].includes(n)) told[w].push(n);
  }, 20);
  // the seat picker asks with confirm(): answered here, and each question kept
  const confirms = [];
  let answer = false;
  window.confirm = (q) => (confirms.push(q), answer);
  const select = (w) => hosts[w].querySelector(".tabletop-seat");

  window.__p = {
    errors, scene, viewers: { a: ana.url, b: ben.url },
    joinB() {
      if (dbg.b) return;
      cleanups.b = Tool(B, hostB);
      dbg.b = hostB.querySelector(".scene-stage").__sceneDebug;
    },
    close(w) { cleanups[w]?.(); cleanups[w] = null; dbg[w] = null; },
    /** cut a view off the network: it keeps running, but nothing it broadcasts arrives, nor reaches it */
    cut(w) { peers[w].cut = true; },
    uncut(w) { peers[w].cut = false; },
    session: (w) => dbg[w].presence.session,
    /** has a view heard from this session in presence? */
    heard: (w, s) => Object.hasOwn(dbg[w].presence.get?.() ?? {}, s),
    seats: () => scene.doc().traits?.["tabletop.seats"] ?? {},
    claim: (sid) => scene.doc().claims?.[`tabletop.seat:${sid}`] ?? null,
    options: (w) => (select(w) ? [...select(w).options].map((o) => [o.value, o.textContent]) : null),
    picked: (w) => select(w)?.value ?? null,
    /** choose a seat in a view's picker, answering any confirm with `yes` */
    pick(w, sid, yes = false) {
      answer = yes;
      const s = select(w);
      s.value = sid;
      s.dispatchEvent(new Event("change"));
      return s.value;
    },
    confirms: () => [...confirms],
    notices: (w) => told[w].map((n) => n.text ?? String(n)),
    /** the name tags a view draws */
    tags: (w) => [...hosts[w].querySelectorAll(".label.tabletop-seat-tag")].map((e) => e.textContent.trim()),
    activity: (w) => dbg[w].local.get().activities?.current ?? null,
  };
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack ?? err}`);
  window.__ready = "failed";
  window.__p = { errors };
}
</script>
