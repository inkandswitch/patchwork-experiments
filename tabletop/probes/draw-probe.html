<!doctype html>
<meta charset="utf-8">
<title>tabletop draw probe</title>
<!-- Driven by probes/draw.mjs. The BUILT scene tool (scene/dist) with the
     BUILT tabletop and card-table plugins (tabletop/dist, card-table/dist: a
     secure deck) in a stub registry, on an in-memory repo, at a Lost Cities
     table set up as the game page does (src/setup.js). Two views of one doc,
     A (Ana) and B (Ben), both open from the start, each view's broadcasts
     (presence, poses, sends) reaching only the other, a few ms late. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  body { display: flex; gap: 8px; }
  #a, #b { width: 700px; height: 520px; flex: none; position: relative; }
</style>
<div id="a"></div><div id="b"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "./fake-repo.js";
import { fill } from "../src/games/lost-cities.js";
import { ensurePieceGLBs } from "../src/pieces.js";
import { tableLayout, writeTable } from "../src/setup.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

// Two views of one handle. A broadcast from one reaches the other only, 5 ms late.
function peer(handle) {
  const eph = new Set();
  const p = {
    url: handle.url,
    doc: () => handle.doc(),
    heads: () => handle.heads?.(),
    change: (fn) => handle.change(fn),
    on: (ev, fn) => (ev === "ephemeral-message" ? eph.add(fn) : handle.on(ev, fn)),
    off: (ev, fn) => (ev === "ephemeral-message" ? eph.delete(fn) : handle.off(ev, fn)),
    broadcast: (message) => setTimeout(() => { for (const fn of p.other.eph) fn({ message, senderId: "peer" }); }, 5),
    eph,
  };
  return p;
}

try {
  for (const url of ["../../scene/dist/index.js", "../dist/index.js", "../../card-table/dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  const repo = new FakeRepo();
  window.repo = repo;
  const ana = repo.add({ "@patchwork": { type: "contact" }, name: "Ana" });
  const ben = repo.add({ "@patchwork": { type: "contact" }, name: "Ben" });
  const game = repo.add({ "@patchwork": { type: "tabletop-game" }, title: "Lost Cities", about: "", pieces: {}, order: [], tables: [] });
  game.change((d) => fill(d));
  await ensurePieceGLBs(repo, game);
  // the game page's table (tool.js setUpTable): the game's GLBs, the decks first, then the scene
  const g = game.doc();
  const fileOf = (k) => (g.pieces[k]?.glbUrl ? { url: g.pieces[k].glbUrl, hint: g.pieces[k].bounds ? { bounds: g.pieces[k].bounds } : null } : null);
  const layout = tableLayout(g, { fileOf, gameUrl: game.url });
  const deckUrls = {};
  for (const [id, deck] of Object.entries(layout.decks)) deckUrls[id] = (await repo.create2(deck)).url;
  const table = { "@patchwork": { type: "scene" }, title: "Draw probe", objects: {}, order: [], dimensions: {}, assets: {}, traits: {}, view: {} };
  writeTable(table, layout, deckUrls);
  const scene = repo.add(table);
  const deck = await repo.find(deckUrls.main);
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const A = peer(scene), B = peer(scene);
  A.other = B; B.other = A;
  const hosts = { a: document.getElementById("a"), b: document.getElementById("b") };
  hosts.a.repo = repo; hosts.b.repo = repo;
  hosts.a.viewerId = ana.url; hosts.b.viewerId = ben.url;
  Tool(A, hosts.a);
  Tool(B, hosts.b);
  const dbg = { a: hosts.a.querySelector(".scene-stage").__sceneDebug, b: hosts.b.querySelector(".scene-stage").__sceneDebug };
  const told = { a: [], b: [] };
  setInterval(() => {
    for (const w of ["a", "b"]) for (const n of dbg[w]?.local.get().notices ?? []) if (!told[w].includes(n)) told[w].push(n);
  }, 20);
  const select = (w) => hosts[w].querySelector(".tabletop-seat");
  const objects = () => scene.doc().objects;
  const hiddenIds = () => Object.keys(objects()).filter((id) => objects()[id].traits?.["tabletop.hidden"]);
  const zoneOf = (id) => {
    const s = dbg.a.scene();
    const m = s.world(id);
    for (const [zid, o] of Object.entries(objects())) {
      const z = o.traits?.["tabletop.zone"];
      if (!z) continue;
      const p = s.toLocal(zid, [m[12], m[13], m[14]]);
      if (p.every((v, k) => v >= z.min[k] && v <= z.max[k])) return z.seat;
    }
    return null;
  };

  window.__p = {
    errors, viewers: { a: ana.url, b: ben.url },
    seats: () => scene.doc().traits?.["tabletop.seats"] ?? {},
    picker: (w) => select(w)?.options.length ?? 0,
    pick(w, sid) { const s = select(w); s.value = sid; s.dispatchEvent(new Event("change")); return s.value; },
    activity: (w) => dbg[w].local.get().activities?.current ?? null,
    phase: () => deck.doc()?.phase ?? null,
    hud: (w) => [...hosts[w].querySelectorAll(".scene-hud, .hud, [class*=hud]")].map((e) => e.textContent.trim()).filter(Boolean),
    notices: (w) => told[w].map((n) => n.text ?? String(n)),
    /** the cards in each seat's hand, and the ones out on the table */
    where() {
      const out = { p1: [], p2: [], table: [] };
      for (const id of hiddenIds()) out[zoneOf(id) ?? "table"].push(id);
      return out;
    },
    /** the pile at the deck's spot, top first */
    pile() {
      const s = dbg.a.scene();
      return hiddenIds().filter((id) => { const m = s.world(id); return Math.hypot(m[12] - 0.3, m[14]) < 0.01; }).sort((p, q) => s.world(q)[13] - s.world(p)[13]);
    },
    transform: (id) => JSON.parse(JSON.stringify(objects()[id]?.transform ?? null)),
    /** the hidden cards a view sees the face of */
    faces: (w) => [...(dbg[w].looks()?.keys?.() ?? [])].filter((id) => objects()[id]?.traits?.["tabletop.hidden"]),
    hovered: (w) => dbg[w].local.get().hovered ?? null,
    /** give a view the keyboard, as clicking into it would (without a click, which the hand would take as a pick-up) */
    focus(w) { const r = hosts[w].querySelector(".scene-stage"); r.focus(); return document.activeElement === r || r.contains(document.activeElement); },
    /** the use prompt's text in a view */
    prompt: (w) => [...hosts[w].querySelectorAll(".use-prompt .use-verb")].map((e) => e.textContent.trim()),
    /** a page point over object `id` in view `w` (its origin, then spiralling out until a pick hits it) */
    aimAt(id, w) {
      const v = dbg[w].viewport;
      const r = v.canvas.getBoundingClientRect();
      const m = v.worldOf(id);
      const p = m && v.project([m[12], m[13], m[14]]);
      if (!p) return null;
      for (let k = 0; k < 900; k++) {
        const a = k * 0.6, rad = 2 * Math.sqrt(k);
        const x = p.x + rad * Math.cos(a), y = p.y + rad * Math.sin(a);
        if (x < 2 || y < 2 || x > r.width - 2 || y > r.height - 2) continue;
        const hit = v.pick(x, y);
        if (hit?.id === id) return { x: r.left + x, y: r.top + y, id: hit.id };
      }
      return null;
    },
  };
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack ?? err}`);
  window.__ready = "failed";
  window.__p = { errors };
}
</script>
