<!doctype html>
<meta charset="utf-8">
<title>parametric harness</title>
<!--
  Test fixture, not the renderer. Loads one source file from ../sources/ and drives it
  through the contract in ../DATATYPE.md: builds naive controls from `params`, keeps
  view-bucket values local, calls render() on a canvas or an <svg>, applies interact()
  patches, and shows notes().$status.

  Serve the parametric/ folder over http (python3 -m http.server 5180) and open
  dev/harness.html?src=harmonograph.js
-->
<style>
  html, body { margin: 0; height: 100%; font: 12px system-ui, sans-serif; background: #f4f4f4; color: #222; }
  body { display: grid; grid-template-columns: 260px 1fr; grid-template-rows: 1fr auto; height: 100%; }
  #controls { grid-row: 1 / span 2; overflow: auto; padding: 12px; border-right: 1px solid #ddd; background: #fafafa; }
  #stage { display: grid; place-content: center; overflow: auto; padding: 16px; }
  #stage canvas, #stage svg { background: #fff; box-shadow: 0 1px 0 #ccc; display: block; }
  #status { padding: 6px 12px; border-top: 1px solid #ddd; font-family: ui-monospace, monospace; font-size: 11px; white-space: pre-wrap; }
  #status.error { color: #b00020; }
  h3 { font-size: 10px; text-transform: uppercase; letter-spacing: .06em; color: #888; margin: 14px 0 4px; }
  h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; margin: 18px 0 6px; border-top: 1px solid #ddd; padding-top: 10px; }
  .field { display: flex; flex-direction: column; gap: 2px; margin-bottom: 6px; }
  .field label { color: #555; }
  .field label small { color: #999; }
  input[type=number], select { width: 100%; box-sizing: border-box; font: inherit; font-family: ui-monospace, monospace; }
  .seg button { font: inherit; margin: 0 2px 2px 0; }
  .seg button[data-on] { background: #ddd; }
  .chips button { font: 10px ui-monospace, monospace; border: 0; background: none; color: #888; cursor: pointer; }
  .row { border-left: 2px solid #ddd; padding-left: 8px; margin: 6px 0; }
  .note { font-size: 10px; color: #777; }
  .hidden { display: none; }
</style>
<div id="controls"></div>
<div id="stage"></div>
<div id="status"></div>
<script type="module">
const statusEl = document.getElementById("status");
const controlsEl = document.getElementById("controls");
const stageEl = document.getElementById("stage");
const say = (t, err) => { statusEl.textContent = t; statusEl.classList.toggle("error", !!err); };
window.addEventListener("error", e => say(e.message, true));
window.addEventListener("unhandledrejection", e => say(String(e.reason), true));

const src = new URLSearchParams(location.search).get("src") || "harmonograph.js";
const mod = await import(`../sources/${src}`);
const { params, output } = mod;
if (!Array.isArray(params) || !output) throw new Error(`${src} must export params[] and output`);

// ---- values -------------------------------------------------------------
const defaultOf = p => p.kind === "list"
  ? (p.default ?? Array.from({ length: p.minItems ?? 0 }, () => rowDefault(p)))
  : structuredClone(p.default);
const rowDefault = p => Object.fromEntries(p.item.map(i => [i.key, defaultOf(i)]));
const values = {}, view = {};
for (const p of params) (p.bucket === "view" ? view : values)[p.key] = defaultOf(p);
window.harness = { values, view, mod }; // for inspection from a driver

const holds = (c, v) => {
  if (!c) return true;
  if (c.all) return c.all.every(x => holds(x, v));
  if (c.any) return c.any.some(x => holds(x, v));
  if (c.not) return !holds(c.not, v);
  const x = v[c.key];
  if ("eq" in c) return x === c.eq;
  if ("neq" in c) return x !== c.neq;
  if ("in" in c) return c.in.includes(x);
  return true;
};

// ---- controls -----------------------------------------------------------
const fields = []; // { p, el, sync, get }
function control(p, get, set, scope) {
  const wrap = document.createElement("div"); wrap.className = "field";
  const label = document.createElement("label");
  label.innerHTML = `${p.label ?? p.key} <small>${p.key}${p.unit ? " " + p.unit : ""}</small>`;
  wrap.append(label);
  const kind = p.control ?? ({ num: "number", int: "number", str: "select", bool: "checkbox", color: "color", list: "list", data: "none" })[p.kind];
  let sync = () => {};
  if (kind === "number" || kind === "range") {
    const i = document.createElement("input"); i.type = kind; i.min = p.min ?? ""; i.max = p.max ?? ""; i.step = p.step ?? "any";
    i.addEventListener("change", () => set(p.kind === "int" ? parseInt(i.value, 10) : parseFloat(i.value)));
    wrap.append(i); sync = () => { i.value = get(); };
  } else if (kind === "text") {
    const i = document.createElement("input"); i.type = "text";
    i.addEventListener("change", () => set(i.value)); wrap.append(i); sync = () => { i.value = get(); };
  } else if (kind === "checkbox") {
    const i = document.createElement("input"); i.type = "checkbox";
    i.addEventListener("change", () => set(i.checked)); wrap.append(i); sync = () => { i.checked = !!get(); };
  } else if (kind === "color") {
    const i = document.createElement("input"); i.type = "color";
    i.addEventListener("change", () => set(i.value)); wrap.append(i); sync = () => { i.value = get(); };
  } else if (kind === "select") {
    const s = document.createElement("select");
    for (const [v, l] of p.options ?? []) { const o = document.createElement("option"); o.value = String(v); o.textContent = l; s.append(o); }
    s.addEventListener("change", () => set((p.options.find(([v]) => String(v) === s.value) ?? [s.value])[0]));
    wrap.append(s); sync = () => { s.value = String(get()); };
  } else if (kind === "seg" || kind === "tiles") {
    const d = document.createElement("div"); d.className = "seg"; const bs = [];
    for (const [v, l] of p.options ?? []) { const b = document.createElement("button"); b.textContent = l; b.onclick = () => set(v); d.append(b); bs.push([v, b]); }
    wrap.append(d); sync = () => { for (const [v, b] of bs) b.toggleAttribute("data-on", v === get()); };
  } else if (kind === "list") {
    const box = document.createElement("div"); wrap.append(box);
    const add = document.createElement("button"); add.textContent = "+ add"; wrap.append(add);
    add.onclick = () => { get().push(rowDefault(p)); rebuild(); };
    sync = () => {
      box.innerHTML = "";
      get().forEach((row, idx) => {
        const r = document.createElement("div"); r.className = "row";
        const rm = document.createElement("button"); rm.textContent = `remove ${idx + 1}`;
        rm.disabled = get().length <= (p.minItems ?? 0);
        rm.onclick = () => { get().splice(idx, 1); rebuild(); };
        r.append(rm);
        for (const ip of p.item) r.append(control(ip, () => row[ip.key], v => { row[ip.key] = v; rebuild(); }, row).el);
        box.append(r);
      });
    };
  } else {
    const n = document.createElement("div"); n.className = "note"; n.textContent = `(${p.kind}: edited through interact())`; wrap.append(n);
  }
  if (p.presets?.length) {
    const c = document.createElement("div"); c.className = "chips";
    for (const chip of p.presets) { const b = document.createElement("button"); b.textContent = chip.label; b.onclick = () => { Object.assign(scope ?? values, chip.also ?? {}); set(chip.value); }; c.append(b); }
    wrap.append(c);
  }
  if (p.note) { const n = document.createElement("div"); n.className = "note"; n.textContent = p.note; wrap.append(n); }
  const noteEl = document.createElement("div"); noteEl.className = "note"; wrap.append(noteEl);
  const f = { p, el: wrap, sync, noteEl }; fields.push(f); sync();
  return f;
}

function rebuild() {
  controlsEl.innerHTML = ""; fields.length = 0;
  let layer = null, section = null;
  for (const p of params) {
    if (p.layer && p.layer !== layer) { layer = p.layer; section = null; const h = document.createElement("h2"); h.textContent = layer; controlsEl.append(h); }
    if (p.section && p.section !== section) { section = p.section; const h = document.createElement("h3"); h.textContent = section; controlsEl.append(h); }
    const store = p.bucket === "view" ? view : values;
    controlsEl.append(control(p, () => store[p.key], v => { store[p.key] = v; paint(); }).el);
  }
  paint();
}

// ---- painting -----------------------------------------------------------
let raf = 0, t0 = performance.now(), surfaceEl = null;
const surfaceKind = output.surfaces.includes("canvas2d") ? "canvas2d" : "svg";

function size() {
  const ext = mod.extent?.(values);
  const w = ext?.width ?? output.width, h = ext?.height ?? output.height;
  if (w != null && h != null) return [w, h];
  return [stageEl.clientWidth - 32, stageEl.clientHeight - 32];
}

function paint() {
  for (const f of fields) { f.el.classList.toggle("hidden", !holds(f.p.showWhen, values)); if (f.p.kind !== "list") f.sync(); }
  const [w, h] = size();
  const fill = output.unit === "mm" ? Math.min((stageEl.clientWidth - 32) / w, (stageEl.clientHeight - 32) / h) : 1;
  const scale = fill * (view.zoom && typeof view.zoom === "number" ? view.zoom : 1);
  const t = (performance.now() - t0) / 1000;
  try {
    if (surfaceKind === "canvas2d") {
      if (!surfaceEl) { surfaceEl = document.createElement("canvas"); stageEl.replaceChildren(surfaceEl); }
      const dpr = window.devicePixelRatio || 1;
      surfaceEl.width = Math.round(w * scale * dpr); surfaceEl.height = Math.round(h * scale * dpr);
      surfaceEl.style.width = `${w * scale}px`; surfaceEl.style.height = `${h * scale}px`;
      const ctx = surfaceEl.getContext("2d");
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.fillStyle = output.background ?? "#fff"; ctx.fillRect(0, 0, surfaceEl.width, surfaceEl.height);
      ctx.scale(scale * dpr, scale * dpr);
      mod.render(values, { kind: "canvas2d", ctx, width: w, height: h, scale: scale * dpr, dpi: 96 * scale * dpr, export: false, t, view });
    } else {
      if (!surfaceEl) { surfaceEl = document.createElementNS("http://www.w3.org/2000/svg", "svg"); stageEl.replaceChildren(surfaceEl); }
      surfaceEl.setAttribute("viewBox", `0 0 ${w} ${h}`);
      surfaceEl.setAttribute("width", w * scale); surfaceEl.setAttribute("height", h * scale);
      surfaceEl.style.background = output.background ?? "#fff";
      surfaceEl.replaceChildren();
      mod.render(values, { kind: "svg", root: surfaceEl, width: w, height: h, scale, dpi: 96 * scale, export: false, t, view });
    }
    // notes() after render(), so status counts computed during the draw are current
    const notes = mod.notes?.(values, view) ?? {};
    for (const f of fields) f.noteEl.textContent = notes[f.p.key] ?? "";
    say(notes.$status ?? `${src}: ${w}×${h} ${output.unit}`);
  } catch (e) { say(`${src}: ${e.stack ?? e}`, true); console.error(e); }
  if (output.animated) { cancelAnimationFrame(raf); raf = requestAnimationFrame(paint); }
}

// interact(): pointer events in output units
function toUnit(ev) {
  const r = surfaceEl.getBoundingClientRect(); const [w, h] = size();
  return { x: (ev.clientX - r.left) / r.width * w, y: (ev.clientY - r.top) / r.height * h };
}
stageEl.addEventListener("pointerdown", e => forward(e));
stageEl.addEventListener("pointermove", e => forward(e));
stageEl.addEventListener("pointerup", e => forward(e));
function forward(ev) {
  if (!mod.interact || !surfaceEl) return;
  const patch = mod.interact({ type: ev.type, ...toUnit(ev), shiftKey: ev.shiftKey, altKey: ev.altKey, buttons: ev.buttons }, values, { width: size()[0], height: size()[1], view });
  if (!patch) return;
  Object.assign(values, patch.values ?? {}); Object.assign(view, patch.view ?? {});
  for (const f of fields) f.sync();
  paint();
}

rebuild();
window.addEventListener("resize", paint);
</script>
