# pnpm 11 reads its settings from this file. There is no root workspace, so
# every package carries the settings it needs rather than inheriting them.
minimumReleaseAge: 0
verifyDepsBeforeRun: false
allowBuilds:
  "@swc/core": true
  cbor-extract: true
  core-js: true
  esbuild: true
# patchwork-next's catalog, so the kernel worker runs what Patchwork runs
overrides:
  "@automerge/automerge": 3.5.0
  "@automerge/automerge-repo": 2.6.0-subduction.49
  "@automerge/automerge-repo-network-broadcastchannel": 2.6.0-subduction.49
  "@automerge/automerge-repo-network-messagechannel": 2.6.0-subduction.49
  "@automerge/automerge-repo-network-websocket": 2.6.0-subduction.49
  "@automerge/automerge-repo-storage-indexeddb": 2.6.0-subduction.49
  "@automerge/automerge-subduction": 0.20.1
  "@automerge/vanillajs": 2.6.0-subduction.49
patchedDependencies:
  # the heads channel, so the kernel worker hears tabs' saves
  '@automerge/automerge-repo@2.6.0-subduction.49': shared/patches/@automerge__automerge-repo@2.6.0-subduction.49.patch
