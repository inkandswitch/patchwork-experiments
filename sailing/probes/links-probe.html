<!doctype html>
<meta charset="utf-8">
<title>links probe</title>
<!-- Driven by probes/links-run.mjs: one Lost Cities game doc G, linked live
     into two scenes (scene/COMPOSITION.md, worked example 3), on the BUILT
     scene, seats, sailing, tabletop, joints, traversal and
     walk plugins in a stub registry, on ONE in-memory repo:
       A (Ana)  a still room: a Card table with G linked onto it;
       B (Ben)  the sloop at anchor: the Card table in her cockpit, G linked
                onto it (the Lost Cities part makes G and links it);
       C (Cara) G open alone;
       D (Ana again, made by i6()) G open alone in a second view of Ana's
                whose handle refuses writes, as a viewer who may only read
                has it; and, by i6(), the room links G twice more, live (a
                repeat: closed, drawn as its hint) and fixed at this version
                (a pin).
     All three views share G's one handle, as views in one page of one repo
     do, so the network carries nothing between them: only the stage's page
     bus does (scene/src/stage/presence.js). One manual clock (window.__time)
     for all three: nothing moves until the probe steps it. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  body { display: flex; gap: 6px; }
  #a, #b, #c { width: 560px; height: 480px; flex: none; position: relative; }
  #d { width: 240px; height: 200px; flex: none; position: relative; }
</style>
<div id="a"></div><div id="b"></div><div id="c"></div><div id="d"></div>
<script type="module">
// a part is the editor's to put in (scene/EDITOR.md, "Parts"): its module, borrowed from scene's source at dev time
import { part as putPart } from "../../scene/src/parts/editor.js";
{
  let a = (Number(new URLSearchParams(location.search).get("seed")) || 1) >>> 0;
  Math.random = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "./fake-repo.js";
import { emptyScene } from "./empty-scene.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

const apply = (m, p) => [0, 1, 2].map((r) => m[r] * p[0] + m[4 + r] * p[1] + m[8 + r] * p[2] + m[12 + r]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/** a viewport key (scene/src/stage/paths.js): the outermost stage's ids are their own */
const SEP = "\u001f";
const keyOf = (n, id) => (n === 0 && !String(id).startsWith(SEP) ? String(id) : `${SEP}${n}${SEP}${id}`);
let time = null;
async function loaded(pred, ms = 20_000) {
  for (const t0 = performance.now(); performance.now() - t0 < ms; ) {
    if (pred()) return true;
    await time.step(1);
    await sleep(16);
  }
  return !!pred();
}
async function pumping(fn) {
  let done = false;
  const out = fn().finally(() => (done = true));
  while (!done) {
    await time.step(1);
    await sleep(16);
  }
  return out;
}

/** Where the Card table goes in the sloop's cockpit, in her hull's frame; the middle of its top, in its frame. */
const COCKPIT_TABLE = { position: [0, 0.72, 2.85], rotation: [0, Math.PI / 2, 0], scale: 1 };
const TABLE_TOP = [0, 0.7006, 0];

try {
  for (const url of ["../../scene/dist/index.js", "../../seats/dist/index.js", "../dist/index.js", "../../walk/dist/index.js", "../../water/dist/index.js", "../../weather/dist/index.js", "../../tabletop/dist/index.js", "../../joints/dist/index.js", "../../traversal/dist/index.js", "../../walk/dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  time = window.__time = (await (await import("../../scene/dist/index.js")).loadTime()).manualTime();
  const repo = new FakeRepo();
  window.repo = repo;
  const people = { a: repo.add({ "@patchwork": { type: "contact" }, name: "Ana" }), b: repo.add({ "@patchwork": { type: "contact" }, name: "Ben" }), c: repo.add({ "@patchwork": { type: "contact" }, name: "Cara" }) };
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const hosts = { a: document.getElementById("a"), b: document.getElementById("b"), c: document.getElementById("c"), d: document.getElementById("d") };
  for (const w of ["a", "b", "c"]) Object.assign(hosts[w], { repo, viewerId: people[w].url, time });
  Object.assign(hosts.d, { repo, viewerId: people.a.url, time });
  const dbg = { a: null, b: null, c: null, d: null };
  const docs = { room: null, boat: null, game: null };
  const ids = {};
  const mount = (w, handle) => {
    Tool(handle, hosts[w]);
    dbg[w] = hosts[w].querySelector(".scene-stage").__sceneDebug;
  };
  const told = { a: [], b: [], c: [] };
  const collect = () => {
    time.frame(collect);
    for (const w of ["a", "b", "c"]) for (const n of dbg[w]?.view.atom.get().notices ?? []) if (!told[w].includes(n)) told[w].push(n);
  };
  time.frame(collect);
  /** an api of the outermost stage of view w */
  const apiOf = (w) => {
    for (const id of ["scene.use", "scene.keys", "scene.add", "sailing"]) { const x = dbg[w].host.record(id)?.api; if (x) return x; }
    return null;
  };
  /** the stage view w shows G in: its own (C, D), else the one its link opened where G acts */
  const gStage = (w) => (dbg[w] ? dbg[w].view.stages().find((s) => s.url === docs.game?.url && s.acts) ?? null : null);
  /** the stage of view w at a link of its outermost doc's */
  const stageAtLink = (w, id) => dbg[w]?.view.stages().find((s) => s.path.length === 1 && s.path[0] === id) ?? null;
  const facesIn = (st) => { const looks = new Map([...(st?.debug?.displayed() ?? [])].map(([i, o]) => [i, o.content instanceof Uint8Array ? { veil: true } : { name: o.name, sourceUrl: o.content }])); return hidden().filter((id) => { const l = looks?.get?.(id); return l && l.veil !== true && l.sourceUrl; }); };
  const gKey = (w, id) => { const s = gStage(w); return s ? keyOf(s.n, id) : null; };
  const G = () => docs.game?.doc() ?? {};
  const gObjects = () => G().objects ?? {};
  const keptBy = (o) => Object.values(o?.traits ?? {}).find((v) => v && typeof v === "object" && typeof v.by === "string" && Number.isInteger(v.slot)) ?? null;
  const deckUrl = () => Object.values(gObjects()).map((o) => keptBy(o)?.by).find(Boolean) ?? null;
  const hidden = () => Object.keys(gObjects()).filter((id) => gObjects()[id].traits?.["tabletop.card"]);
  /** a G snapshot (any view's G stage: the doc is the same doc) */
  const gScene = () => (gStage("c") ?? gStage("a") ?? gStage("b")).scene();
  const zoneOf = (id) => {
    const s = gScene();
    const m = s.world(id);
    for (const [zid, o] of Object.entries(gObjects())) {
      const z = o.traits?.["tabletop.zone"];
      if (!z) continue;
      const p = s.toLocal(zid, [m[12], m[13], m[14]]);
      if (p.every((v, k) => v >= z.min[k] && v <= z.max[k])) return z.seat;
    }
    return null;
  };
  const page = (w, p) => {
    const v = dbg[w].viewport;
    const r = v.canvas.getBoundingClientRect();
    const q = v.project(p);
    return q?.visible === false ? null : { x: r.left + q.x, y: r.top + q.y };
  };
  const upOf = (m) => { const l = Math.hypot(m[4], m[5], m[6]) || 1; return [m[4] / l, m[5] / l, m[6] / l]; };
  const tiltDeg = (u) => (Math.acos(Math.max(-1, Math.min(1, u[1]))) * 180) / Math.PI;

  const P = (window.__p = {
    errors, ids, people: Object.fromEntries(Object.entries(people).map(([w, h]) => [w, h.url])),
    /**
     * The boat as a person makes her (B: Ship at anchor, the Card table in her cockpit, Lost Cities on it: the part
     * makes G and links it), then the room (A: a Card table, and G linked onto it: the same G), then G alone (C).
     */
    build: () => pumping(build),
    async open() { return true; },
  });
  async function build() {
    docs.boat = repo.add(emptyScene({ title: "Lost Cities aboard" }));
    mount("b", docs.boat);
    const button = await (async () => { await loaded(() => hosts.b.querySelector('[data-template="ship-at-anchor"]')); return hosts.b.querySelector('[data-template="ship-at-anchor"]'); })();
    if (!button) return { error: "no Ship at anchor on the start screen" };
    button.click();
    const withTrait = (h, t) => Object.entries(h.doc().objects ?? {}).find(([, o]) => o.traits?.[t])?.[0] ?? null;
    await loaded(() => withTrait(docs.boat, "sailing.ship") && dbg.b.host.record("sailing")?.api);
    ids.hull = withTrait(docs.boat, "sailing.ship");
    const bapi = apiOf("b");
    bapi.change((d) => { d.title = "Lost Cities aboard"; });
    ids.boatTable = await putPart(bapi, "tabletop.table", { parent: ids.hull, transform: COCKPIT_TABLE });
    if (!ids.boatTable) return { error: "no Card table aboard", notices: P.notices("b") };
    ids.boatLink = await putPart(bapi, "tabletop.lost-cities", { parent: ids.boatTable, transform: { position: TABLE_TOP, rotation: [0, 0, 0], scale: 1 } });
    if (!ids.boatLink) return { error: "no Lost Cities aboard", notices: P.notices("b") };
    const link = docs.boat.doc().objects[ids.boatLink];
    docs.game = await repo.find(link.sourceUrl);
    bapi.change((d) => { d.view.start = { body: "seat" }; });
    // the room: a still floor, a Card table, the same G linked onto it
    docs.room = repo.add(emptyScene({ title: "Quiet room", view: { start: { body: "seat" } } }));
    mount("a", docs.room);
    await loaded(() => apiOf("a"));
    const aapi = apiOf("a");
    ids.roomTable = await putPart(aapi, "tabletop.table", { parent: null, transform: { position: [0, 0, 0], rotation: [0, 0, 0], scale: 1 } });
    ids.roomLink = await aapi.addObject(docs.game.url, { parent: ids.roomTable, transform: { position: TABLE_TOP, rotation: [0, 0, 0], scale: 1 }, hint: link.hint, fields: { locked: true } });
    // a part selects what it makes: let go, so attention is the look
    dbg.a.view.select(null);
    dbg.b.view.select(null);
    // G alone
    mount("c", docs.game);
    await loaded(() => gStage("a")?.debug.host.instanceOf("tabletop") && gStage("b")?.debug.host.instanceOf("tabletop") && gStage("c")?.debug.host.instanceOf("tabletop"));
    // the board, G's first locked piece; the hands
    const go = gObjects();
    ids.board = Object.keys(go).find((id) => go[id].kind !== "group" && go[id].locked) ?? null;
    ids.hand1 = Object.keys(go).find((id) => go[id].traits?.["tabletop.zone"]?.seat === "p1");
    ids.hand2 = Object.keys(go).find((id) => go[id].traits?.["tabletop.zone"]?.seat === "p2");
    ids.game = docs.game.url;
    return { ...ids };
  }
  async function i6() {
    const aapi = apiOf("a");
    const point = aapi.fixPoint(ids.roomLink);
    if (!point) return { error: "the room's link has no version to fix" };
    const pinHand = P.where().p1;
    // what Ana sees now: the pin must go on showing exactly this
    const pinFaces = facesIn(gStage("a"));
    const base = JSON.parse(JSON.stringify(docs.room.doc().objects[ids.roomLink]));
    ids.repeatLink = `${ids.roomLink}~repeat`;
    ids.pinLink = `${ids.roomLink}~pin`;
    aapi.change((d) => {
      const place = (id, x, extra) => {
        d.objects[id] = { ...base, parent: null, transform: { position: [x, 0, 1.2], rotation: [0, 0, 0], scale: 1 }, ...extra };
        d.order.push(id);
      };
      place(ids.repeatLink, 0.8, {});
      place(ids.pinLink, -0.8, { at: JSON.parse(JSON.stringify(point)) });
    });
    // D: G alone, for Ana, through a handle that refuses writes (Keyhive's "may only read", as the stage sees it)
    const g = docs.game;
    const readOnly = new Proxy(g, { get: (t, p) => (p === "isReadOnly" ? () => true : typeof t[p] === "function" ? t[p].bind(t) : t[p]) });
    mount("d", readOnly);
    const up = (st) => st?.debug.host.instanceOf("tabletop") && st.debug.host.instanceOf("card-table") && st.debug.host.instanceOf("seats");
    const ok = await loaded(() => up(stageAtLink("a", ids.pinLink)) && up(gStage("d")) && apiOf("a").link(ids.repeatLink)?.role === "closed", 60_000);
    if (!ok) return { error: "the pin and D never both ran G's extensions, or the repeat never closed", stages: P.i6Stages() };
    return { pinHand, pinFaces, deps: Object.keys(point.deps ?? {}).length, repeatLink: ids.repeatLink, pinLink: ids.pinLink };
  }
  Object.assign(P, {
    /** view w's focus: the links entered ([]: its outermost doc) */
    focusPath: (w) => dbg[w].view.atom.get().focus,
    /** where view w runs an extension: the paths of the stages that run it (a general part runs in the focus stage alone) */
    // (an extension runs in a stage; a view plugin has its facet at the focus stage: scene/STAGE.md, "View plugins")
    runsIn: (w, ext) => dbg[w].view.stages().filter((s) => (s.debug.host.instanceOf(ext) || s.debug.facets().includes(ext))).map((s) => [...s.path]),
    /** what each of view w's stages runs because its doc calls for it (not the general parts, which follow the focus) */
    traitRuns: (w) => dbg[w].view.stages().map((s) => [s.path.join("/"), s.role, s.debug.host.running().map((r) => r.id)]),
    /** Enter on a link of the focus stage's, as the menu runs it (scene.focus's command): false where it can't */
    enter(w, id) {
      const c = dbg[w].view.focusStage()?.debug.view.plugins.instanceOf("scene.focus")?.commands.find((k) => k.id === "enter");
      const st = c?.state(id);
      if (!st || st.disabled) return false;
      c.run(id);
      return true;
    },
    /** each view's stages: [{ n, url, path }] */
    stages: (w) => dbg[w].view.stages().map((s) => ({ n: s.n, url: s.url, path: [...s.path] })),
    link: (w) => (w === "a" ? apiOf("a").link(ids.roomLink) : w === "b" ? apiOf("b").link(ids.boatLink) : null),
    shape: () => ({
      boatHasGamePieces: Object.values(docs.boat.doc().objects).some((o) => o.traits?.["tabletop.card"]),
      roomHasGamePieces: Object.values(docs.room.doc().objects).some((o) => o.traits?.["tabletop.card"]),
      boatLink: docs.boat.doc().objects[ids.boatLink],
      roomLink: docs.room.doc().objects[ids.roomLink],
      sameGame: docs.boat.doc().objects[ids.boatLink]?.sourceUrl === docs.room.doc().objects[ids.roomLink]?.sourceUrl,
      gameTitle: G().title,
      seats: Object.keys(G().traits?.seats ?? {}),
      boatSeats: docs.boat.doc().traits?.seats ?? null,
      roomSeats: docs.room.doc().traits?.seats ?? null,
      running: Object.fromEntries(["a", "b", "c"].map((w) => [w, { outer: dbg[w].host.running().map((r) => r.id), game: gStage(w)?.debug.host.running().map((r) => r.id) ?? null }])),
    }),
    seats: () => G().traits?.seats ?? {},
    pick(w, sid) {
      const sel = gStage(w) && [...hosts[w].querySelectorAll(".seats-pick")].find((s) => [...s.options].some((o) => o.value === sid));
      if (!sel) return null;
      sel.value = sid;
      sel.dispatchEvent(new Event("change"));
      return sel.value;
    },
    body: (w) => dbg[w].view.atom.get().body,
    notices: (w) => told[w].map((n) => n.text ?? String(n)),
    phase: () => (deckUrl() ? repo.handles.get(deckUrl())?.doc()?.phase ?? null : null),
    /** G's channel as each view hears it: the sessions in its presence, and its own */
    presence: (w) => { const s = gStage(w); return s ? { mine: s.debug.presence.session, peers: Object.keys(s.debug.presence.get()) } : null; },
    /** does each view's G stage hear the other two views' sessions? */
    hearsAll: () => ["a", "b", "c"].every((w) => { const p = P.presence(w); return p && ["a", "b", "c"].filter((x) => x !== w).every((x) => p.peers.includes(P.presence(x)?.mine)); }),
    // (the claims service's, scene.claims: scene/NATIVE.md, "Claims")
    claims: (w) => gStage(w)?.debug.host.instanceOf("scene.claims")?.held().map((c) => c.kind) ?? [],
    claimedBy: (w, sid) => gStage(w)?.debug.host.record("seats")?.api.use("claims").claimedBy(null, `seat:${sid}`) ?? null,
    faces: (w) => facesIn(gStage(w)),
    /**
     * I6 with the real packages, mid-play (Ana seated at p1 in the room, Ben at p2 aboard, dealt): the
     * room links G twice more, live (a repeat: closed, Ana's own view seated in the acting stage) and fixed at
     * this version (a pin: the room link's fixPoint); and Ana opens G alone in a second view (D) whose
     * handle refuses writes. Link ids sort after the room link's, so G still acts where Ana sits.
     */
    i6: () => pumping(i6),
    /** the faces each I6 stage shows: Ana's acting stage in the room, the pin, and D */
    i6Faces: () => ({ acting: facesIn(gStage("a")), pin: facesIn(stageAtLink("a", ids.pinLink)), d: facesIn(gStage("d")) }),
    /** what the pin's keeper and audience say of a card of Ana's hand (for a failing check's details) */
    i6Why: (id) => {
      const st = stageAtLink("a", ids.pinLink);
      if (!st) return null;
      const api = st.debug.host.record("tabletop")?.api;
      const kept = st.debug.host.instanceOf("card-table");
      const aud = api?.use("audience");
      const looks = new Map([...(st.debug?.displayed() ?? [])].map(([i, o]) => [i, o.content instanceof Uint8Array ? { veil: true } : { name: o.name, sourceUrl: o.content }]));
      return { audience: aud ? aud.audience(id) : "no api", shown: aud?.shown(id) ?? null, look: looks.get(id) ?? null, looks: looks.size, hud: kept?.hud?.() ?? null, roster: api?.collect("roster").map((r) => r.value?.viewers?.(api.scene())) ?? null, packages: st.packages?.complete?.() ?? null, failed: st.debug.host.failed?.() ?? null, at: G().title };
    },
    i6Stages: () => {
      const one = (st) => (st ? { role: st.role, writable: st.debug.host.record("tabletop")?.api.writable() ?? null, running: st.debug.host.running().map((r) => r.id) } : null);
      return { acting: one(gStage("a")), repeat: one(stageAtLink("a", ids.repeatLink)), pin: one(stageAtLink("a", ids.pinLink)), d: one(gStage("d")), aLinks: { repeat: apiOf("a").link(ids.repeatLink), pin: apiOf("a").link(ids.pinLink), room: apiOf("a").link(ids.roomLink) } };
    },
    where() { const out = { p1: [], p2: [], table: [] }; for (const id of hidden()) out[zoneOf(id) ?? "table"].push(id); return out; },
    /** the deck's pile, at its spot ([0.3, 0] in G's root frame), top first */
    pile() {
      const s = gScene();
      const at = (id) => s.world(id).slice(12, 15);
      return hidden().filter((id) => { const p = at(id); return Math.hypot(p[0] - 0.3, p[2]) < 0.01; }).sort((p, q) => at(q)[1] - at(p)[1]);
    },
    /** a card's doc pose in G's root frame */
    inGame(id) { const m = gScene().world(id); return { local: m.slice(12, 15).map((v) => +v.toFixed(4)), up: +upOf(m)[1].toFixed(4), parent: gObjects()[id]?.parent ?? null }; },
    /** a G object as drawn in view w: its world position and how far its up leans from the world's (deg) */
    drawn(id, w) { const m = dbg[w].viewport.worldOf(gKey(w, id)); return m ? { p: m.slice(12, 15), tilt: tiltDeg(upOf(m)), up: upOf(m) } : null; },
    /** the camera's up in view w, and how far it leans */
    cameraUp(w) { const u = dbg[w].viewport.camera.up; return { up: [u.x, u.y, u.z], tilt: tiltDeg([u.x, u.y, u.z]) }; },
    hovered: (w) => gStage(w)?.debug.local.get().hovered ?? null,
    /** who's here in view w's body chip: { session: text } */
    here: (w) => Object.fromEntries([...hosts[w].querySelectorAll(".body-person")].map((e) => [e.dataset.session, e.textContent.trim()])),
    /** does view w's who's here list each of these sessions, and none of them as looking or editing? */
    hereBusy: (w, sessions) => { const h = P.here(w); return sessions.every((x) => typeof h[x] === "string" && !/· (look|edit)$/i.test(h[x])); },
    prompt: (w) => [...hosts[w].querySelectorAll(".use-prompt:not([hidden]) .use-verb")].map((e) => e.querySelector(".use-name")?.textContent?.trim() ?? e.textContent.trim()),
    focus(w) { const r = hosts[w].querySelector(".scene-stage"); r.focus(); return document.activeElement === r || r.contains(document.activeElement); },
    pageOf(id, local, w) { const m = dbg[w].viewport.worldOf(gKey(w, id)); return m ? page(w, apply(m, local)) : null; },
    /** a page point over G's object `id` in view `w` (spiralling out from its origin until a pick hits it) */
    aimAt(id, w, local = null) {
      const v = dbg[w].viewport;
      const key = gKey(w, id);
      const r = v.canvas.getBoundingClientRect();
      const m = v.worldOf(key);
      const p0 = m && v.project(local ? apply(m, local) : [m[12], m[13], m[14]]);
      if (!p0) return null;
      for (let k = 0; k < 900; k++) {
        const a = k * 0.6, rad = 1.5 * Math.sqrt(k);
        const x = p0.x + rad * Math.cos(a), y = p0.y + rad * Math.sin(a);
        if (x < 2 || y < 2 || x > r.width - 2 || y > r.height - 2) continue;
        if (v.pick(x, y)?.id !== key) continue;
        const on = (px) => px > 2 && px < r.width - 2 && v.pick(px, y)?.id === key;
        let lo = x, hi = x;
        while (x - lo < 60 && on(lo - 1)) lo--;
        while (hi - x < 60 && on(hi + 1)) hi++;
        return { x: r.left + (lo + hi) / 2, y: r.top + y };
      }
      return null;
    },
    resume() { apiOf("b").use("clock").resume(); return apiOf("b").use("clock").t(); },
    // ─── presence where it is (scene/COMPOSITION.md §3; TOOLS.md §6) ───
    /** view w's clock chips, outermost first: { doc, text } (doc: the name it shows, "" at the outermost) */
    chips: (w) => [...hosts[w].querySelectorAll(".clock-chip")].map((c) => ({ doc: c.querySelector(".clock-doc").hidden ? "" : c.querySelector(".clock-doc").textContent, text: c.querySelector(".clock-text").textContent })),
    /** view w's stage of G at its outermost link (the room's, the boat's), entered or left */
    enterG(w) { return P.enter(w, w === "a" ? ids.roomLink : ids.boatLink); },
    leaveG(w) { dbg[w].view.leave(); return dbg[w].view.atom.get().focus.length; },
    session: (w) => dbg[w].view.session,
    /** in each of view w's stages of G (path, role): whether its part `ext` runs there, and what it draws in its world layer */
    layerIn(w, ext) {
      // (a pin's url names G at its heads: G's stages are those whose url starts with G's)
      return dbg[w].view.stages().filter((s) => typeof s.url === "string" && s.url.startsWith(docs.game?.url)).map((s) => {
        const groups = [...(dbg[w].viewport.layers.get(keyOf(s.n, ext)) ?? [])];
        return { path: s.path.join("/"), role: s.role, runs: !!s.debug.host.instanceOf(ext), children: groups.flatMap((g) => g.children) };
      });
    },
    /** each stage of G's peer selection boxes in view w */
    peerBoxes: (w) => P.layerIn(w, "scene.others").map(({ children, ...x }) => ({ ...x, boxes: children.map((h) => h.userData.selection).sort() })),
    /** each stage of G's avatars in view w, and the first one's world position (its layer followed to where its stage's root is drawn now) */
    avatars(w) {
      dbg[w].viewport.followLayers();
      return P.layerIn(w, "walk.people").map(({ children, ...x }) => {
        const g = children[0];
        let top = g;
        while (top?.parent) top = top.parent;
        top?.updateMatrixWorld(true);
        const e = g?.matrixWorld.elements;
        return { ...x, n: children.length, at: e ? [e[12], e[13], e[14]] : null };
      });
    },
    /** where Cara's avatar should be drawn in view w now: her feet (G's frame, as she says them on G's channel) through G's root as w draws it */
    caraIn(w) {
      const st = gStage(w);
      const feet = st?.debug.presence.get()[dbg.c.view.session]?.keys?.walk?.avatar?.feet;
      const link = w === "a" ? keyOf(0, ids.roomLink) : keyOf(0, ids.boatLink);
      const m = dbg[w].viewport.worldOf(link);
      return feet && m ? apply(m, feet) : null;
    },
    /** Cara walks (her view is G alone): off the seat body she watched from, onto walk */
    caraWalks() { if (dbg.c.view.atom.get().body?.id !== "look") dbg.c.view.enterBody("look"); return !!dbg.c.view.enterBody("walk"); },
    caraSelects(id) { dbg.c.view.select(id == null ? null : [id]); return dbg.c.view.atom.get().selected; },
    stepFrames: async (n) => { for (let i = 0; i < n; i++) await time.step(1, { draw: false }); return n; },
    /** sample, frame by frame for `ms` of the page's clock, how far a G card leans in each view, and B's camera's up against G's table */
    async sampleLean(id, ms = 6000) {
      const out = { a: [], b: [], c: [], camB: [], camA: [] };
      for (let i = 0, n = Math.ceil(ms / time.frameMs); i < n; i++) {
        await time.step(1, { draw: false });
        for (const w of ["a", "b", "c"]) { const d = P.drawn(id, w); if (d) out[w].push(d.tilt); }
        const t = dbg.b.viewport.worldOf(gKey("b", ids.board));
        const cu = dbg.b.viewport.camera.up;
        if (t) { const u = upOf(t); out.camB.push(Math.hypot(u[0] - cu.x, u[1] - cu.y, u[2] - cu.z)); }
        const ca = dbg.a.viewport.camera.up;
        out.camA.push(Math.hypot(ca.x, ca.y - 1, ca.z));
      }
      const max = (xs) => (xs.length ? Math.max(...xs) : null);
      return { a: max(out.a), b: max(out.b), c: max(out.c), bMin: out.b.length ? Math.min(...out.b) : null, camOffTableB: max(out.camB), camOffWorldA: max(out.camA), frames: out.a.length };
    },
  });
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack ?? err}`);
  window.__ready = "failed";
  window.__p = { errors };
}
</script>
