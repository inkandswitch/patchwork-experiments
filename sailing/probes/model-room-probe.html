<!doctype html>
<meta charset="utf-8">
<title>model room probe</title>
<!-- Driven by probes/model-room-run.mjs (water/WATER.md, "Clipped open
     water"): two boats at anchor, each a doc of her own whose open water
     carries a clip (her template's), linked live at 1:25 into a dry room R
     (no water, no weather), as the Model room publisher lays them out: each
     floats on a block of her own sea, its floor on the room's floor; no open
     surface. Then her water is shrunk from under one (held where she was),
     and given back (she goes on); then R is linked into a wet harbour H:
     the blocks go and both float on H's sea. On the BUILT scene, sailing,
     water, joints and traversal plugins in a stub registry, on ONE
     in-memory repo, and one manual clock (window.__time). -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  body { display: flex; gap: 6px; }
  #h, #a { width: 820px; height: 520px; flex: none; position: relative; }
</style>
<div id="h"></div><div id="a"></div>
<script type="module">
{
  let a = (Number(new URLSearchParams(location.search).get("seed")) || 1) >>> 0;
  Math.random = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "./fake-repo.js";
import { emptyScene } from "./empty-scene.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const mul = (A, B) => {
  const o = new Array(16).fill(0);
  for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += A[k * 4 + r] * B[c * 4 + k];
  return o;
};
const deg = (d) => (d * Math.PI) / 180;
let time = null;
async function loaded(pred, ms = 30_000) {
  for (const t0 = performance.now(); performance.now() - t0 < ms; ) {
    if (pred()) return true;
    await time.step(1);
    await sleep(16);
  }
  return !!pred();
}
async function pumping(fn) {
  let done = false;
  const out = fn().finally(() => (done = true));
  while (!done) {
    await time.step(1);
    await sleep(16);
  }
  return out;
}

const S = 1 / 25; // the room's scale for its dioramas
const GAP = 0.6;

try {
  for (const url of ["../../scene/dist/index.js", "../dist/index.js", "../../walk/dist/index.js", "../../water/dist/index.js", "../../weather/dist/index.js", "../../joints/dist/index.js", "../../traversal/dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  time = window.__time = (await (await import("../../scene/dist/index.js")).loadTime()).manualTime();
  const repo = new FakeRepo();
  window.repo = repo;
  const me = repo.add({ "@patchwork": { type: "contact" }, name: "Ana" });
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const hosts = { h: document.getElementById("h"), a: document.getElementById("a") };
  for (const w of Object.keys(hosts)) Object.assign(hosts[w], { repo, viewerId: me.url, time });
  const dbg = { h: null, a: null };
  const unmounts = { h: null, a: null };
  const docs = { A: null, B: null, R: null, H: null };
  const ids = {};
  const mount = (w, handle) => {
    unmounts[w]?.();
    hosts[w].replaceChildren();
    unmounts[w] = Tool(handle, hosts[w]);
    dbg[w] = hosts[w].querySelector(".scene-stage").__sceneDebug;
  };
  const unmount = (w) => {
    unmounts[w]?.();
    unmounts[w] = null;
    dbg[w] = null;
    hosts[w].replaceChildren();
  };
  const withTrait = (h, t) => Object.entries(h.doc().objects ?? {}).find(([, o]) => o.traits?.[t])?.[0] ?? null;
  const seaOf = (h) => Object.entries(h.doc().objects ?? {}).find(([, o]) => o.traits?.water && o.traits["sailing.sea"])?.[0] ?? null;
  /** the stage at this path of link ids (none: the view's outermost) */
  const stageAt = (w, path = []) => dbg[w]?.view.stages().find((s) => s.path.length === path.length && s.path.every((x, i) => x === path[i])) ?? null;
  const inst = (st, ext) => st?.debug.host.instanceOf(ext) ?? null;
  const meshes = (w, name, fn) => {
    const out = [];
    dbg[w].viewport.scene.traverse((o) => {
      if (o.name !== name) return;
      for (let p = o; p; p = p.parent) if (p.visible === false) return;
      out.push(fn ? fn(o) : o);
    });
    return out;
  };

  async function fromTemplate(title, template) {
    const doc = repo.add(emptyScene({ title }));
    mount("a", doc);
    const sel = `[data-template="${template}"]`;
    await loaded(() => hosts.a.querySelector(sel));
    hosts.a.querySelector(sel).click();
    await loaded(() => withTrait(doc, "sailing.ship") && inst(stageAt("a"), "sailing") && inst(stageAt("a"), "water"));
    doc.change((d) => { d.title = title; });
    return doc;
  }

  /** The room's links as publish-model-room.mjs lays them: each block square to the room, left to right, its floor on y = 0. */
  function layout(boats) {
    const widths = boats.map((b) => b.clip[0] * S);
    const total = widths.reduce((s, w) => s + w, 0) + GAP * (boats.length - 1);
    let x = -total / 2;
    return boats.map((b, i) => {
      const theta = -b.yaw;
      const cx = x + widths[i] / 2;
      x += widths[i] + GAP;
      const c = b.at;
      const rx = c[0] * Math.cos(theta) + c[2] * Math.sin(theta), rz = -c[0] * Math.sin(theta) + c[2] * Math.cos(theta);
      return { position: [cx - S * rx, S * (b.clip[1] - c[1]), -S * rz], rotation: [0, theta, 0], scale: S, block: { x: cx, w: widths[i], l: b.clip[2] * S } };
    });
  }
  const link = (name, url, transform, half) => ({ name, sourceUrl: url, providerId: "scene.link", renderUrl: null, parent: null, group: null, visible: true, color: null, opacity: 1, wireframe: false, locked: true, transform, hint: { bounds: { min: [-half, -1, -half], max: [half, 1, half] } } });

  const P = (window.__p = {
    errors,
    /** A and B: two boats at anchor by the template, each her Sea's clip from her layout */
    build: () => pumping(async () => {
      docs.A = await fromTemplate("Ship at anchor", "ship-at-anchor");
      docs.B = await fromTemplate("Lost Cities aboard (its boat's shape)", "ship-at-anchor");
      unmount("a");
      for (const k of ["A", "B"]) {
        ids[`hull${k}`] = withTrait(docs[k], "sailing.ship");
        ids[`sea${k}`] = seaOf(docs[k]);
        ids[`clip${k}`] = docs[k].doc().objects[ids[`sea${k}`]].traits.water.clip;
      }
      return { ...ids };
    }),
    alone: (which) => pumping(async () => {
      mount("a", docs[which]);
      await loaded(() => inst(stageAt("a"), "sailing") && inst(stageAt("a"), "water"));
      return true;
    }),
    closeAlone: () => unmount("a"),
    /** R: a dry room (no water, no weather) with A and B linked live at 1:25, as the publisher lays them out */
    room: () => pumping(async () => {
      const boats = ["A", "B"].map((k) => {
        const o = docs[k].doc().objects[ids[`sea${k}`]];
        return { k, clip: o.traits.water.clip, at: o.transform.position, yaw: o.transform.rotation[1] };
      });
      const lay = layout(boats);
      const R = emptyScene({ title: "Model room", view: { grid: true, axes: false, start: { home: { position: [0, 6, 11.5], target: [0, 0, 0] } } } });
      R.objects = { LA: link("Ship at anchor", docs.A.url, (({ block, ...t }) => t)(lay[0]), 3), LB: link("Lost Cities aboard", docs.B.url, (({ block, ...t }) => t)(lay[1]), 3) };
      R.order = ["LA", "LB"];
      docs.R = repo.add(R);
      mount("h", docs.R);
      const up = () => ["LA", "LB"].every((id) => inst(stageAt("h", [id]), "sailing") && inst(stageAt("h", [id]), "water"));
      const ok = await loaded(up, 60_000);
      return ok ? { blocks: lay.map((l) => l.block), links: lay.map(({ block, ...t }) => t), stages: dbg.h.view.stages().map((s) => ({ path: [...s.path], role: s.role, running: s.debug.host.running().map((r) => r.id) })) } : { error: "the room's stages never all ran sailing and water" };
    }),
    /** H: a wet harbour (a Sea and the weather) with R linked into it */
    wet: () => pumping(async () => {
      const H = emptyScene({ title: "Harbour", view: { grid: false, axes: false, start: { home: { position: [0, 6, 11.5], target: [0, 0, 0] } } } });
      H.traits = { weather: { wind: 5, from: 250, seed: 7 } };
      H.objects = {
        hsea: { name: "Sea", sourceUrl: null, providerId: null, renderUrl: null, parent: null, group: null, visible: true, color: null, opacity: 1, wireframe: false, locked: true, transform: { position: [0, 0, 0], rotation: [0, 0, 0], scale: 1 }, traits: { water: {}, "sailing.sea": { seed: 7, scale: 0.5 } } },
        LR: link("Model room", docs.R.url, { position: [0, 0, 0], rotation: [0, 0, 0], scale: 1 }, 6),
      };
      H.order = ["hsea", "LR"];
      docs.H = repo.add(H);
      mount("h", docs.H);
      const up = () => ["LA", "LB"].every((id) => inst(stageAt("h", ["LR", id]), "sailing") && inst(stageAt("h", ["LR", id]), "water")) && inst(stageAt("h"), "water");
      const ok = await loaded(up, 60_000);
      return ok ? { stages: dbg.h.view.stages().map((s) => ({ path: [...s.path], role: s.role })) } : { error: "the harbour's stages never all ran" };
    }),
    oceans: (w) => meshes(w, "ocean").length,
    patches: (w) => meshes(w, "water-patch").length,
    /** each drawn block: its vertices, how many are its skirt and floor, whether it is seen from both sides */
    faces: (w) => meshes(w, "water-patch", (m) => {
      const f = m.geometry.attributes.aFace?.array ?? [];
      let side = 0;
      for (const v of f) side += v > 0.5 ? 1 : 0;
      return { vertices: f.length, sides: side, doubleSided: m.material.side === 2 };
    }),
    /** which stages of view w draw the open surface, which draw blocks (of which bodies), and whose clip is live */
    drawers: (w) => dbg[w].view.stages().map((s) => ({ path: [...s.path], open: !!inst(s, "water")?.debug.surface, patches: inst(s, "water")?.debug.patches ?? [], clip: inst(s, "water")?.debug.clip?.() ?? null })),
    /** a hull and the water under her, in her own stage's frame (the path of links to her doc) */
    under: (w, path, hull) => {
      const st = stageAt(w, path ?? []);
      const m = st.displayedWorld(hull);
      const sea = inst(st, "sailing").debug.sea;
      const r = sea.oceanAt([m[12], m[13], m[14]], hull);
      const doc = st.doc().objects[hull].transform;
      return { y: m[13], x: m[12], z: m[14], h: r ? r.heightAt(m[12], m[14], st.reader.use("clock").t()) : null, body: r ? r.body : "none", doc: doc.position, simulating: !!inst(st, "sailing").debug.sim.simulating?.(), world: !!sea.world?.(), frameScale: st.frame()?.matrix ? Math.hypot(st.frame().matrix[0], st.frame().matrix[1], st.frame().matrix[2]) : 1 };
    },
    /** her Sea's clip: shrunk to a box away from her (her water gone from under her), or given back */
    setClip: (k, clip) => {
      docs[k].change((d) => {
        d.objects[ids[`sea${k}`]].traits.water.clip = [...clip];
      });
      return docs[k].doc().objects[ids[`sea${k}`]].traits.water.clip;
    },
    huds: (w) => [...hosts[w].querySelectorAll(".sail-hud")].map((e) => e.style.display !== "none"),
    notices: (w) => (dbg[w]?.view.atom.get().notices ?? []).map((n) => n.text ?? String(n)),
  });
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack || err}`);
  window.__ready = true;
}
</script>
