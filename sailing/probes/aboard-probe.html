<!doctype html>
<meta charset="utf-8">
<title>aboard probe</title>
<!-- Driven by probes/aboard-run.mjs (checks) and probes/publish-aboard.mjs
     (publishing what it builds). The BUILT scene tool (scene/dist) with the
     BUILT seats, sailing, tabletop and keeper plugins (seats/dist, sailing/dist,
     tabletop/dist, card-table/dist: the joint keeper; keep/dist), and the
     joints and traversal plugins her companionway's traits are for
     (joints/dist, traversal/dist), in a stub registry, on an
     in-memory repo, on an EMPTY scene. Two views of one doc, A (Ana) and B
     (Ben), each view's broadcasts reaching only the other, a few ms late.
     build() makes the scene the way a person would, through the stage's own
     calls: the start screen's "Ship at anchor" template (A clicks it), then
     the parts bin's Card table in her cockpit and Lost Cities on the table
     (api.part). B opens it after. Nothing here imports another package's
     source: each package's built dist is loaded as its plugins.
     Both views run on one manual clock (scene's manualTime, window.__time):
     nothing moves until the probe steps it, broadcasts included. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  body { display: flex; gap: 8px; }
  #a, #b { width: 700px; height: 520px; flex: none; position: relative; }
</style>
<div id="a"></div><div id="b"></div>
<script type="module">
// ?seed=N (default 1): Math.random seeded (mulberry32), so the template's sea and wind, and
// whatever else draws on it (ids, sessions), are the same every run
{
  let a = (Number(new URLSearchParams(location.search).get("seed")) || 1) >>> 0;
  Math.random = () => {
    a = (a + 0x6d2b79f5) >>> 0;
    let t = a;
    t = Math.imul(t ^ (t >>> 15), t | 1);
    t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
import { getRegistry, registerPlugins } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "./fake-repo.js";
import { emptyScene } from "./empty-scene.js";

// invariant I asserted on every walker step (walker.asserting): a breach throws in the crew's tick, so it shows as an error
globalThis.__SAILING_ASSERT__ = true;
const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

// Two views of one handle. A broadcast from one reaches the other only, 5 ms late (of the page's clock).
let time = null;
function peer(handle) {
  const eph = new Set();
  const p = {
    url: handle.url,
    doc: () => handle.doc(),
    heads: () => handle.heads?.(),
    change: (fn, opts) => handle.change(fn, opts), // (opts: the edit recorder's patchCallback, so undo works here too)
    on: (ev, fn) => (ev === "ephemeral-message" ? eph.add(fn) : handle.on(ev, fn)),
    off: (ev, fn) => (ev === "ephemeral-message" ? eph.delete(fn) : handle.off(ev, fn)),
    broadcast: (message) => time.after(5, () => { for (const fn of p.other.eph) fn({ message, senderId: "peer" }); }),
    eph,
  };
  return p;
}

/** A doc as JSON, its bytes as { $bytes: base64 }, so it can leave the page. */
const portable = (doc) =>
  JSON.parse(JSON.stringify(doc, (k, v) => {
    if (v instanceof Uint8Array) {
      let s = "";
      for (let i = 0; i < v.length; i += 0x8000) s += String.fromCharCode(...v.subarray(i, i + 0x8000));
      return { $bytes: btoa(s) };
    }
    return v;
  }));

// 4 × 4, column-major
const apply = (m, p) => [0, 1, 2].map((r) => m[r] * p[0] + m[4 + r] * p[1] + m[8 + r] * p[2] + m[12 + r]);
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
/** Loading (packages, content): the wall's, with the page's frames going at its pace meanwhile. → whether `pred` held within ms */
async function loaded(pred, ms = 15_000) {
  for (const t0 = performance.now(); performance.now() - t0 < ms; ) {
    if (pred()) return true;
    await time.step(1);
    await sleep(16);
  }
  return !!pred();
}
/** Run `fn` (async: loading, a part laid out) with the page's frames going at the wall's pace until it's done. */
async function pumping(fn) {
  let done = false;
  const out = fn().finally(() => (done = true));
  while (!done) {
    await time.step(1);
    await sleep(16);
  }
  return out;
}

/** Where the Card table goes in the sloop's cockpit, in her hull's frame: between the benches, forward of the wheel, its long side across her. */
const COCKPIT_TABLE = { position: [0, 0.72, 2.85], rotation: [0, Math.PI / 2, 0], scale: 1 };
/** The middle of the Card table's top, in its frame (tabletop's TABLE.h, and the baize). */
const TABLE_TOP = [0, 0.7006, 0];
/** The scene's home view: over the cockpit from her starboard quarter, in her hull's frame. */
const HOME = { position: [2.4, 3.1, 6.4], target: [0, 1.3, 2.85] };

try {
  // ?urls= (package folder → its URL): each package's plugins registered from it, as a real shell does, so
  // the stages can say which package each plugin comes from (publish-aboard checks what each doc lists)
  const urls = JSON.parse(new URLSearchParams(location.search).get("urls") || "{}");
  for (const [dir, url] of [["scene", "../../scene/dist/index.js"], ["seats", "../../seats/dist/index.js"], ["sailing", "../dist/index.js"], ["water", "../../water/dist/index.js"], ["tabletop", "../../tabletop/dist/index.js"], ["card-table", "../../card-table/dist/index.js"], ["keep", "../../keep/dist/index.js"], ["joints", "../../joints/dist/index.js"], ["traversal", "../../traversal/dist/index.js"]]) {
    registerPlugins((await import(url)).plugins, urls[dir]);
  }
  time = window.__time = (await (await import("../../scene/dist/index.js")).loadTime()).manualTime();
  const repo = new FakeRepo();
  window.repo = repo;
  const ana = repo.add({ "@patchwork": { type: "contact" }, name: "Ana" });
  const ben = repo.add({ "@patchwork": { type: "contact" }, name: "Ben" });
  // an empty scene, as the scene datatype's init makes it. With ?held, its world starts paused: setting up,
  // loading and dealing take the wall's time (as many frames as they take), so aboard-run resumes the world
  // where its scripted part begins, and every run sails the same sea from the same moment
  const held = new URLSearchParams(location.search).has("held");
  const scene = repo.add({ ...emptyScene(), ...(held ? { clock: { running: false, t: 0 } } : {}) });
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const A = peer(scene), B = peer(scene);
  A.other = B; B.other = A;
  const hosts = { a: document.getElementById("a"), b: document.getElementById("b") };
  // every double-click a host hears: what it landed on, and the view's focus just after (for step 13's report)
  const dbls = { a: [], b: [] };
  for (const w of ["a", "b"])
    hosts[w].addEventListener("dblclick", (e) => {
      const t = e.target;
      const v = dbg[w]?.view;
      const r = v?.canvas.getBoundingClientRect();
      const hit = v && r ? v.viewport.pick(e.clientX - r.left, e.clientY - r.top) : null;
      dbls[w].push({ on: `${t.tagName.toLowerCase()}.${String(t.className || "")}`, x: e.clientX, y: e.clientY, hit: hit?.id ? v.pathOfKey(hit.id) : null, focus: v?.atom.get().focus ?? null, top: r?.top, left: r?.left, w: r?.width, cam: v?.viewport.getCamera()?.position?.map((x) => +x.toFixed(3)), frame: window.__time?.frames?.() });
    });
  hosts.a.repo = repo; hosts.b.repo = repo;
  hosts.a.viewerId = ana.url; hosts.b.viewerId = ben.url;
  hosts.a.time = time; hosts.b.time = time;
  Tool(A, hosts.a);
  const dbg = { a: hosts.a.querySelector(".scene-stage").__sceneDebug, b: null };
  const told = { a: [], b: [] };
  // every notice either view shows, collected every frame (a notice lives 6 s of the page's clock)
  const collect = () => {
    time.frame(collect); // first: a pass that throws doesn't end the loop
    for (const w of ["a", "b"]) for (const n of dbg[w]?.local.get().notices ?? []) if (!told[w].includes(n)) told[w].push(n);
  };
  time.frame(collect);
  const objects = () => scene.doc().objects ?? {};
  // The game is a doc of its own (scene/COMPOSITION.md): the Lost Cities part makes G and links it onto the
  // table. Its pieces are G's objects; each view shows them in G's stage, under its own viewport keys.
  let game = null;
  const gameObjects = () => game?.doc().objects ?? {};
  const inGame = (id) => !!game && !!gameObjects()[id];
  const gStage = (w) => (game && dbg[w] ? dbg[w].view.stages().find((x) => x.url === game.url) ?? null : null);
  // the focus stage's debug: where the general parts (the halo, the inspector) run
  const fdbg = (w) => dbg[w].view.focusStage()?.debug ?? dbg[w];
  const SEP = "\u001f";
  /** a viewport key (scene/src/stage/paths.js): the outermost stage's ids are their own */
  const keyIn = (w, id) => { if (!inGame(id)) return id; const n = gStage(w)?.n; return n == null ? null : n === 0 ? id : `${SEP}${n}${SEP}${id}`; };
  const mul = (a, b) => { const o = new Array(16).fill(0); for (let c = 0; c < 4; c++) for (let r = 0; r < 4; r++) for (let k = 0; k < 4; k++) o[c * 4 + r] += a[k * 4 + r] * b[c * 4 + k]; return o; };
  /** a G snapshot (A's G stage: the doc is the same doc) */
  const gScene = () => gStage("a")?.scene() ?? gStage("b")?.scene();
  /** an object's doc pose in the boat's world: a game piece's through the link */
  const docWorld = (id) => (inGame(id) ? mul(dbg.a.scene().world(ids.link), gScene().world(id)) : dbg.a.scene().world(id));
  const byName = (n) => Object.entries(objects()).find(([, o]) => o.name === n)?.[0] ?? null;
  const withTrait = (t) => Object.entries(objects()).find(([, o]) => o.traits?.[t])?.[0] ?? null;
  // a card's keeper binding, whichever keeper keeps it ({ by, slot } under the keeper's own trait)
  const keptBy = (o) => Object.values(o?.traits ?? {}).find((v) => v && typeof v === "object" && typeof v.by === "string" && Number.isInteger(v.slot)) ?? null;
  const deckUrl = () => Object.values(gameObjects()).map((o) => keptBy(o)?.by).find(Boolean) ?? null;
  const deck = () => (deckUrl() ? repo.handles.get(deckUrl())?.doc() ?? null : null);
  const select = (w) => hosts[w].querySelector(".seats-pick");
  const ids = {};
  /** any running extension's api in a view: the stage's public calls (api.part) */
  const apiOf = (w) => {
    for (const id of ["sailing", "tabletop", "scene.use", "scene.carry", "scene.add"]) { const a = dbg[w].host.record(id)?.api; if (a) return a; }
    return null;
  };
  const ctx = (w) => dbg[w]?.host.record("sailing")?.instance?.debug ?? null;
  const hidden = () => Object.keys(gameObjects()).filter((id) => gameObjects()[id].traits?.["tabletop.card"]);
  const zoneOf = (id) => {
    const s = gScene();
    const m = s.world(id);
    for (const [zid, o] of Object.entries(gameObjects())) {
      const z = o.traits?.["tabletop.zone"];
      if (!z) continue;
      const p = s.toLocal(zid, [m[12], m[13], m[14]]);
      if (p.every((v, k) => v >= z.min[k] && v <= z.max[k])) return z.seat;
    }
    return null;
  };
  /** a world point → page px in a view (null off screen) */
  const page = (w, p) => {
    const v = dbg[w].viewport;
    const r = v.canvas.getBoundingClientRect();
    const q = v.project(p);
    return q?.visible === false ? null : { x: r.left + q.x, y: r.top + q.y };
  };

  const P = (window.__p = {
    errors, viewers: { a: ana.url, b: ben.url }, ids,
    get A() { return dbg.a; },
    get B() { return dbg.b; },
    templates: (w) => [...hosts[w].querySelectorAll("[data-template]")].map((b) => b.dataset.template),
    /** what the boat's stage (or, with `inGame`, the game's) calls for and who answers, and what its doc lists */
    packages(w, inGameStage = false) {
      const st = inGameStage ? gStage(w)?.debug : dbg[w];
      const i = st?.packages.inspect();
      return i ? { answering: i.answering.map((p) => ({ id: p.id, importUrl: p.importUrl })), listed: i.listed } : null;
    },

    /**
     * The scene, as a person makes it: Ship at anchor from the start screen,
     * the Card table into her cockpit, Lost Cities onto the table, a home
     * view over the cockpit. → the ids, or { error }.
     */
    build: (o) => pumping(() => build(o)),
  });
  /** (P.build, its frames pumped) */
  async function build({ title = "Lost Cities aboard" } = {}) {
      const button = hosts.a.querySelector('[data-template="ship-at-anchor"]');
      if (!button) return { error: "no Ship at anchor on the start screen", templates: P.templates("a") };
      button.click();
      await loaded(() => withTrait("sailing.ship") && dbg.a.host.record("sailing")?.api);
      const hull = withTrait("sailing.ship");
      if (!hull) return { error: "no ship" };
      const api = apiOf("a");
      // the title first: the deck doc is named for the scene
      api.change((d) => { d.title = title; });
      const table = await api.part("tabletop.table", { parent: hull, transform: COCKPIT_TABLE });
      if (!table) return { error: "no Card table", notices: P.notices("a") };
      const link = await api.part("tabletop.lost-cities", { parent: table, transform: { position: TABLE_TOP, rotation: [0, 0, 0], scale: 1 } });
      if (!link) return { error: "no Lost Cities", notices: P.notices("a") };
      game = await repo.find(objects()[link].sourceUrl);
      await loaded(() => gStage("a")?.debug.host.instanceOf("tabletop"));
      // the board: G's first locked piece
      const board = Object.keys(gameObjects()).find((id) => gameObjects()[id].kind !== "group" && gameObjects()[id].locked) ?? null;
      // where the scene starts someone new (view.start, as the inspector's Starts in and Set home view write it):
      // through the game's link, as the game starts people (watching from a seat: TOOLS.md §2, a start placed
      // on a link), and a camera over the cockpit, not fitted to the islet
      const m = dbg.a.scene().world(hull);
      api.change((d) => {
        if (!d.view.start) d.view.start = {};
        delete d.view.start.body;
        d.view.start.place = link;
        d.view.start.home = { position: apply(m, HOME.position).map((v) => +v.toFixed(4)), target: apply(m, HOME.target).map((v) => +v.toFixed(4)) };
      });
      dbg.a.view.select(null);
      Object.assign(ids, {
        hull, table, link, board, game: game.url,
        hand1: Object.entries(gameObjects()).find(([, o]) => o.traits?.["tabletop.zone"]?.seat === "p1")?.[0],
        hand2: Object.entries(gameObjects()).find(([, o]) => o.traits?.["tabletop.zone"]?.seat === "p2")?.[0],
        rig: withTrait("sailing.sail"), windlass: withTrait("sailing.anchor"), wheel: withTrait("sailing.helm"), mast: byName("Mast"), mainsheet: withTrait("sailing.mainsheet"),
        jib: withTrait("sailing.jib"), winch: byName("Port jib winch"),
        companionway: withTrait("traversal.exit"), hatch: withTrait("joints.slide"),
      });
      return { ...ids };
  }
  Object.assign(P, {
    /** the world's clock running again (api.clock.resume, as the clock chip's ▶ does): → its t */
    resume() { apiOf("a").clock.resume(); return apiOf("a").clock.t(); },
    openB() { if (!dbg.b) { Tool(B, hosts.b); dbg.b = hosts.b.querySelector(".scene-stage").__sceneDebug; } return true; },

    /** the doc's shape, for the checks */
    shape() {
      const o = objects();
      const g = gameObjects();
      const pieces = Object.entries(g).filter(([id, x]) => x.kind !== "group" && (x.traits?.["tabletop.card"] || x.traits?.["tabletop.zone"] || id === ids.board));
      return {
        title: scene.doc().title,
        // the boat holds one link to G, locked, under the table, and none of G's pieces or seats
        link: o[ids.link] ? { parent: o[ids.link].parent, locked: !!o[ids.link].locked, providerId: o[ids.link].providerId, game: o[ids.link].sourceUrl } : null,
        boatPieces: Object.values(o).filter((x) => x.traits?.["tabletop.card"] || x.traits?.["tabletop.zone"]).length,
        boatSeats: scene.doc().traits?.seats ?? null,
        gameTitle: game?.doc().title ?? null,
        gameStart: game?.doc().view?.start?.body ?? null,
        start: scene.doc().view?.start?.body ?? null,
        startsThroughLink: !!ids.link && scene.doc().view?.start?.place === ids.link,
        home: scene.doc().view?.start?.home ?? null,
        tableParent: o[ids.table]?.parent ?? null,
        tableLocked: !!o[ids.table]?.locked,
        pieces: pieces.length,
        piecesAtGameRoot: pieces.filter(([, x]) => (x.parent ?? null) === null).length,
        seats: game?.doc().traits?.seats ?? null,
        deckType: deck()?.["@patchwork"]?.type ?? null,
        deckTitle: deck()?.title ?? null,
        sail: o[ids.rig]?.traits?.["sailing.sail"] ?? null,
        anchor: o[ids.windlass]?.traits?.["sailing.anchor"] ?? null,
        shipLocked: !!o[ids.hull]?.locked,
        companionway: o[ids.companionway] ? { parent: o[ids.companionway].parent, exit: o[ids.companionway].traits?.["traversal.exit"] ?? null } : null,
        hatch: o[ids.hatch] ? { parent: o[ids.hatch].parent, slide: o[ids.hatch].traits?.["joints.slide"] ?? null } : null,
        exits: Object.values(o).filter((x) => x.traits?.["traversal.exit"]).length,
      };
    },
    seats: () => game?.doc().traits?.seats ?? {},
    picker: (w) => select(w)?.options.length ?? 0,
    pick(w, sid) { const s = select(w); s.value = sid; s.dispatchEvent(new Event("change")); return s.value; },
    /** what view w's body chip says ("Watching", "Seated", "Look", "Aboard") */
    bodyLabel: (w) => dbg[w]?.local.get().body?.label ?? null,
    // walking her deck: the crew's bodies on top of the stack (scene/TOOLS.md §4)
    walking: (w) => ["aboard", "station"].includes(dbg[w]?.local.get().body?.id),
    /** the body on top of view w's stack, and the stack */
    body: (w) => ({ ...dbg[w].local.get().body, stack: dbg[w].router.bodies().map((x) => x.id) }),
    /** the body chip's rect, and its menu's item starting `label`, to click */
    chip: (w) => { const e = hosts[w].querySelector(".body-chip"); if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.x + r.width / 2, y: r.y + r.height / 2, text: e.textContent }; },
    chipItem: (w, label) => { const e = [...hosts[w].querySelectorAll(".body-menu .menu-item")].find((x) => x.textContent.trim().startsWith(label)); if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.x + r.width / 2, y: r.y + r.height / 2 }; },
    /** the prompt's verbs with their keycaps: [{ key, name }] (a key only where pressing it does that) */
    promptKeys: (w) => [...hosts[w].querySelectorAll(".use-prompt:not([hidden]) .use-verb")].map((e) => ({ key: e.querySelector(".use-key")?.textContent ?? "", name: e.querySelector(".use-name")?.textContent?.trim() ?? "" })),
    phase: () => deck()?.phase ?? null,
    notices: (w) => told[w].map((n) => n.text ?? String(n)),
    // a face is a look with a source (what the card really is); a veil (the stage's stand-in) and a back (no look) aren't
    faces(w) {
      const looks = gStage(w)?.debug.looks();
      return hidden().filter((id) => { const l = looks?.get?.(id); return l && l.veil !== true && l.sourceUrl; });
    },
    veils(w) { const looks = gStage(w)?.debug.looks(); return hidden().filter((id) => looks?.get?.(id)?.veil === true); },
    // the claims a view holds, in the boat (the clock) and in G (the seats)
    claims: (w) => [...dbg[w].claims(), ...(gStage(w)?.debug.claims() ?? [])].map((c) => c.kind),
    simulating: (w) => !!ctx(w)?.sim.simulating(),
    loaded(w) {
      const vp = dbg[w].viewport;
      // (what has content: not a group, a link, or an object with no source, as the Sea)
      const all = [...Object.keys(objects()).filter((id) => objects()[id].kind !== "group" && objects()[id].providerId !== "scene.link" && objects()[id].sourceUrl != null), ...Object.keys(gameObjects()).filter((id) => gameObjects()[id].kind !== "group")];
      return { total: all.length, loaded: all.filter((id) => vp.contentOf(keyIn(w, id))?.loaded).length };
    },
    loading: (w) => { const st = [...Object.values(dbg[w].local.get().status ?? {}), ...Object.values(gStage(w)?.debug.local.get().status ?? {})]; return { loading: st.filter((s) => s?.state === "loading").length, errors: st.filter((s) => s?.state === "error").length }; },
    where() {
      const out = { p1: [], p2: [], table: [] };
      for (const id of hidden()) out[zoneOf(id) ?? "table"].push(id);
      return out;
    },
    /** the pile at the deck's spot (layout [0.3, 0] on the table), top first */
    pile() {
      // the deck's spot, [0.3, 0] of G's root (G sits on the table's top)
      const s = gScene();
      const at = (id) => s.world(id).slice(12, 15);
      return hidden().filter((id) => { const p = at(id); return Math.hypot(p[0] - 0.3, p[2]) < 0.01; }).sort((p, q) => at(q)[1] - at(p)[1]);
    },
    transform: (id) => JSON.parse(JSON.stringify((inGame(id) ? gameObjects() : objects())[id]?.transform ?? null)),
    parentOf: (id) => (inGame(id) ? gameObjects() : objects())[id]?.parent ?? null,
    /** an object's doc pose in the table's frame: its position, whether its +Y is the table's, and its doc parent (a game piece's: G's root is null) */
    onTable(id) {
      const s = dbg.a.scene();
      const m = docWorld(id), t = s.world(ids.table);
      const up = [m[4], m[5], m[6]], tu = [t[4], t[5], t[6]];
      const dot = (up[0] * tu[0] + up[1] * tu[1] + up[2] * tu[2]) / (Math.hypot(...up) * Math.hypot(...tu));
      return { local: s.toLocal(ids.table, m.slice(12, 15)).map((v) => +v.toFixed(4)), up: +dot.toFixed(4), parent: P.parentOf(id), game: inGame(id) };
    },
    // what a view hovers or has selected, in the doc it's in (G's, through the link; else the boat's)
    /** view w's selection as the view keeps it: a path, the links from the boat in, then the object */
    selectionPath: (w) => dbg[w].view.atom.get().selected,
    /** is it one of G's objects? */
    inGame: (id) => inGame(id),
    /** the boat's title, and its name for the link to G (the trail's crumbs) */
    boatTitle: () => scene?.doc().title ?? null,
    linkName: () => objects()[ids.link]?.name ?? null,
    /** the boat's link to G as the boat's doc holds it (the host's facts: placement, parent, lock) */
    linkRecord: () => { const o = objects()[ids.link]; return o ? { parent: o.parent, transform: o.transform, locked: !!o.locked, sourceUrl: o.sourceUrl } : null; },
    /** of these objects, the one in plain sight on view w's screen farthest from its edges: { id, x, y } (page px), or null */
    aimBest(ids, w) {
      const r = dbg[w].viewport.canvas.getBoundingClientRect();
      let best = null;
      for (const id of ids) {
        const a = P.aimAt(id, w);
        if (!a) continue;
        const margin = Math.min(a.x - r.left, r.right - a.x, a.y - r.top, r.bottom - a.y);
        if (!best || margin > best.margin) best = { ...a, id, margin };
      }
      return best ? { ...best, top: r.top, left: r.left, w: r.width, cam: dbg[w].viewport.getCamera()?.position?.map((v) => +v.toFixed(3)), frame: window.__time?.frames?.() } : null;
    },
    /** a camera over G's table, looking down on it from just A's side of above: { position, target } in the world */
    overTable(w) { const m = dbg[w].viewport.worldOf(ids.link); return m ? { position: apply(m, [0, 0.95, 0.3]), target: apply(m, [0, 0, 0]) } : null; },
    /** put view w's camera at `c` ({ position, target }, in the world): where a person would orbit it to */
    setCam(w, c) { dbg[w].viewport.setCamera(c); return true; },
    /** the double-clicks view w heard: [{ on, x, y, hit, focus, top, left, w, cam, frame }] (after the stage's own handling) */
    dbls: (w) => dbls[w],
    /** view w's focus: the links entered ([]: the boat) */
    focusPath: (w) => dbg[w].view.atom.get().focus,
    /** the trail (breadcrumb) view w shows while its focus is inside a link: its crumbs' text, or null */
    trail: (w) => { const t = hosts[w].querySelector(".stage-trail"); return t ? [...t.querySelectorAll(".trail-crumb, .trail-here")].map((e) => e.textContent) : null; },
    /** where view w runs an extension: the paths of the stages that run it (a general part runs in the focus stage alone) */
    runsIn: (w, ext) => dbg[w].view.stages().filter((s) => s.debug.host.instanceOf(ext)).map((s) => s.path),
    /** what each of view w's stages sees selected: [path, its element] */
    seen: (w) => dbg[w].view.stages().filter((s) => s.acts).map((s) => [s.path, s.debug.local.get().selected ?? null]),
    hovered: (w) => gStage(w)?.debug.local.get().hovered ?? dbg[w].local.get().hovered ?? null,
    selected: (w) => gStage(w)?.debug.local.get().selected ?? dbg[w].local.get().selected ?? null,
    /** the right-click menu's items on a view's page: label and middle */
    menu: (w) => [...hosts[w].querySelectorAll(".context-menu .menu-item")].map((e) => { const r = e.getBoundingClientRect(); return { label: e.querySelector(".menu-label")?.textContent.trim() ?? "", x: r.x + r.width / 2, y: r.y + r.height / 2, disabled: e.disabled }; }),
    // the halo is a general part: it runs in the focus stage (the boat's, until A enters G)
    /** what a view's halo is on, and the frame it's drawn in (its doc parent's) */
    halo: (w) => { const h = fdbg(w).host.instanceOf("scene.halo")?.debug; return h?.target ? { ...h.target, parent: h.frame?.parentId ?? null } : null; },
    /** why a view's halo is or isn't on what it has selected */
    haloWhy: (w) => { const d = fdbg(w); const l = d.local.get(); const o = d.scene().objects[l.selected]; return { running: l.running.map((r) => r.id).includes("scene.halo"), held: l.held?.command ?? null, selected: l.selected ?? null, inScene: !!o, locked: !!o?.locked, kind: o?.kind ?? null, writable: d.host.record("scene.halo")?.api?.writable?.() ?? null, dragging: d.host.instanceOf("scene.halo")?.debug?.dragging ?? null }; },
    /** a halo arrow's point (a third along it), and `along` frame units further, on a view's page */
    haloAt(w, axis, along = 0) {
      const h = fdbg(w).host.instanceOf("scene.halo")?.debug;
      const x = h?.handles.find((k) => k.kind === "move" && k.axis === axis);
      if (!x) return null;
      const p = x.from.map((v, i) => v + (x.to[i] - v) / 3);
      p[axis] += along;
      // (the halo's frame is in its stage's root frame: the focus stage's, G's once A has entered it; the world from there)
      return page(w, dbg[w].view.focusStage().frame().pointOut(h.frame.pointOut(p)));
    },
    focus(w) { const r = hosts[w].querySelector(".scene-stage"); r.focus(); return document.activeElement === r || r.contains(document.activeElement); },
    prompt: (w) => [...hosts[w].querySelectorAll(".use-prompt:not([hidden]) .use-verb")].map((e) => e.querySelector(".use-name")?.textContent?.trim() ?? e.textContent.trim()),
    worldOf: (id, w) => { const m = dbg[w].viewport.worldOf(keyIn(w, id)); return m ? [...m] : null; },
    /** a point in an object's frame, as drawn, on a view's page */
    pageOf(id, local, w) { const m = dbg[w].viewport.worldOf(keyIn(w, id)); return m ? page(w, apply(m, local)) : null; },
    cam: (w) => dbg[w].viewport.getCamera(),
    held: (w) => dbg[w].viewport.holds > 0,
    /** where the seat's view puts the camera now: its camera through the drawn table */
    seatView(sid, w) {
      // a seat's camera is in G's root frame, which is the link's, as drawn
      const c = P.seats()[sid]?.camera;
      const m = c ? dbg[w].viewport.worldOf(ids.link) : null;
      return m ? { position: apply(m, c.position), target: apply(m, c.target) } : null;
    },
    /** how far view w's camera's up is from G's table's up (the seat view rolls with it) */
    upOffTable(w) { const m = dbg[w].viewport.worldOf(ids.link); const u = dbg[w].viewport.camera.up; if (!m) return null; const l = Math.hypot(m[4], m[5], m[6]); return Math.hypot(u.x - m[4] / l, u.y - m[5] / l, u.z - m[6] / l); },
    /** the name tags a view shows: text and page px */
    tags: (w) => [...hosts[w].querySelectorAll(".label.seat-tag")].map((e) => { const r = e.getBoundingClientRect(); return { text: e.textContent.trim(), x: r.x + r.width / 2, y: r.y + r.height / 2, shown: e.style.display !== "none" && r.width > 0 }; }),
    me: (w) => ctx(w)?.crew.me() ?? null,
    walker: (w) => { const s = ctx(w)?.crew.walker?.(); return s ? { mode: s.mode, ship: s.ship ?? null } : null; },
    /** what the sailing HUD says in a view: its state, the way-in button, the keys line, and where its panel is */
    hud(w) {
      const h = hosts[w].querySelector(".sail-hud");
      if (!h) return null;
      const btn = h.querySelector(".sail-hint button");
      const panel = h.querySelector(".sail-panel");
      const r = panel && !panel.hidden ? panel.getBoundingClientRect() : null;
      const host = hosts[w].getBoundingClientRect();
      return { state: h.dataset.state, seated: h.hasAttribute("data-seated"), button: btn && !btn.hidden ? btn.textContent : null, keys: h.querySelector('[data-k="keys"]')?.textContent ?? "", advice: h.querySelector('[data-k="advice"]')?.textContent ?? "", panel: r ? { left: r.left - host.left, top: r.top - host.top, bottom: r.bottom - host.top, width: r.width, hostHeight: host.height } : null };
    },
    /** a fitting's position in the hull's frame, as the doc has it */
    hullLocal(id) { const s = dbg.a.scene(); return s.toLocal(ids.hull, s.world(id).slice(12, 15)).map((v) => +v.toFixed(3)); },
    /** a station's live value (the simulating view's) */
    live: (id, k) => Number(ctx("a")?.sim.value(id)?.[k]),
    /** the jib's side held (its doc trait): "port" | "starboard" | null */
    jibHeld: () => objects()[ids.jib]?.traits?.["sailing.jib"]?.held ?? null,
    /** the jib's doc trait: { sheet, held, furl } */
    jib: () => objects()[ids.jib]?.traits?.["sailing.jib"] ?? null,
    /** put a view's body somewhere aboard: local to ship `on` */
    place: (w, on, position, yaw, pitch) => ctx(w).crew.place(on, position, yaw, pitch),
    read: (w) => ctx(w)?.sim.read(ids.hull) ?? null,
    commit: (w, id, fields) => ctx(w).sim.commit(id, fields),
    /** an editor's move of the hull: her doc transform turned to `yaw` (the sim starts again from there, at rest) */
    turnHull(yaw) { scene.change((d) => { d.objects[ids.hull].transform.rotation = [0, yaw, 0]; }); return true; },
    wind: () => scene.doc().traits?.["sailing.weather"]?.wind ?? null,
    /** the sea's wind freshened (as the inspector's Sea field writes it) */
    setWind(speed) { scene.change((d) => { d.traits["sailing.weather"].wind.speed = speed; }); return true; },
    /**
     * Sample, every frame for `ms` of the page's clock, where a point on the
     * table is on each view's page, and where the table is in the world.
     */
    async sampleTable(ms = 10000) {
      const out = { a: [], b: [], world: [] };
      for (let i = 0, n = Math.ceil(ms / time.frameMs); i < n; i++) {
        await time.step(1, { draw: false }); // (no picture: a sample)
        for (const w of ["a", "b"]) { const p = P.pageOf(ids.table, TABLE_TOP, w); if (p) out[w].push([p.x, p.y]); }
        const m = dbg.a.viewport.worldOf(ids.table);
        if (m) out.world.push([m[12], m[13], m[14], Math.atan2(m[8], m[10])]);
      }
      return out;
    },
    /** a page point over object `id` in view `w` (around its origin, until a pick hits it) */
    aimAt(id, w, local = null) {
      const v = dbg[w].viewport;
      const r = v.canvas.getBoundingClientRect();
      const key = keyIn(w, id);
      const m = v.worldOf(key);
      const p0 = m && v.project(local ? apply(m, local) : [m[12], m[13], m[14]]);
      if (!p0) return null;
      for (let k = 0; k < 900; k++) {
        const a = k * 0.6, rad = 1.5 * Math.sqrt(k);
        const x = p0.x + rad * Math.cos(a), y = p0.y + rad * Math.sin(a);
        if (x < 2 || y < 2 || x > r.width - 2 || y > r.height - 2) continue;
        const hit = v.pick(x, y);
        if (hit?.id !== key) continue;
        // the middle of its run of pixels across the screen, not the first one the spiral meets (its edge): she rolls,
        // and the eye stays level, so a pointer on the edge of a mast or a card is off it a moment later
        const on = (px) => px > 2 && px < r.width - 2 && v.pick(px, y)?.id === key;
        let lo = x, hi = x;
        while (x - lo < 60 && on(lo - 1)) lo--;
        while (hi - x < 60 && on(hi + 1)) hi++;
        return { x: r.left + (lo + hi) / 2, y: r.top + y, id };
      }
      return null;
    },
    /** the doc snapshot to publish: the scene, its deck and its files */
    /** the docs to publish: the boat, G, G's deck, and both docs' files */
    snapshot() {
      const urls = [scene.url, game?.url, deckUrl(), ...Object.values(scene.doc().assets ?? {}).map((a) => a.url), ...Object.values(game?.doc().assets ?? {}).map((a) => a.url)].filter(Boolean);
      return { scene: scene.url, game: game?.url ?? null, deck: deckUrl(), docs: Object.fromEntries([...new Set(urls)].map((u) => [u, portable(repo.handles.get(u).doc())])) };
    },
  });
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack ?? err}`);
  window.__ready = "failed";
  window.__p = { errors };
}
</script>
