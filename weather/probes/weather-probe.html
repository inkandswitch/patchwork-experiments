<!doctype html>
<meta charset="utf-8">
<title>weather probe</title>
<!-- Driven by probes/weather-run.mjs. The BUILT scene tool (scene/dist) with
     the BUILT weather plugin (weather/dist) in a stub registry, on an
     in-memory repo: an empty scene whose only trait is `weather` (index.js's
     init: Cadboro Bay, 15:00 on 15 July 2026), opened in Edit. Nothing here
     imports another package's source: each package's dist is loaded as its
     plugins, as Patchwork's registry does. window.__p is what the runner
     reads and drives. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  #a { width: 100vw; height: 100vh; position: relative; }
</style>
<div id="a"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "./fake-repo.js";
import { emptyScene } from "./empty-scene.js";
// the package's own pure functions, evaluated here: the same engine and the same time-zone data as the stage's
import { atmosphereOf, sunOf } from "../src/atmosphere.js";
import { sunDirection } from "../src/solar.js";
import { localOf, offsetAt } from "../src/time.js";
import { weatherParams, windOf } from "../src/weather.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

try {
  const scenePkg = await import("../../scene/dist/index.js");
  const weatherPkg = await import("../dist/index.js");
  for (const { plugins } of [scenePkg, weatherPkg]) for (const p of plugins) getRegistry(p.type).register(p);
  const init = weatherPkg.plugins[0].describes.weather.init;
  const repo = new FakeRepo();
  const scene = repo.add(emptyScene({ title: "Weather probe", traits: { weather: { ...init } } }));
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const host = document.getElementById("a");
  host.repo = repo;
  host.viewerId = "viewer:a";
  Tool(scene, host);
  const dbg = host.querySelector(".scene-stage").__sceneDebug;
  const vp = dbg.viewport;
  const rectOf = (e) => { const r = e.getBoundingClientRect(); return { x: r.x + r.width / 2, y: r.y + r.height / 2, w: r.width, h: r.height }; };

  window.__p = {
    errors,
    init,
    doc: () => scene.doc(),
    weather: () => scene.doc().traits.weather,
    /** a field written as the inspector's slider would: one field */
    set: (k, v) => scene.change((d) => { d.traits.weather[k] = v; }),
    ambient: (name) => dbg.view.ambient(name) ?? null,
    /** what this page's engine computes from the doc's weather, by the package's pure functions */
    expected() {
      const p = weatherParams(scene.doc().traits.weather);
      const sun = sunOf(p);
      return { params: p, atmosphere: atmosphereOf(p), wind: windOf(p), sun, direction: sunDirection(sun.azimuth, sun.apparent) };
    },
    localOf: (t, zone) => localOf(t, zone),
    offsetAt: (zone, t) => offsetAt(zone, t),
    icu: () => Intl.DateTimeFormat().resolvedOptions().timeZone + " / " + navigator.userAgent.match(/Chrome\/[0-9.]+/)?.[0],
    running: () => dbg.local.get().running.map((r) => r.id),
    body: () => dbg.local.get().body?.id ?? null,
    /** the viewport's key light: its position and target (the direction it shines from is position - target) */
    key: () => ({ position: vp.keyLight.position.toArray(), target: vp.keyLight.target.position.toArray(), intensity: vp.keyLight.intensity, color: `#${vp.keyLight.color.getHexString()}`, shadows: vp.keyLight.castShadow }),
    /** the toolbar's controls as shown: [{ ext, command, tag, text, title, options, rect }] */
    toolbar: () => [...host.querySelectorAll(".toolbar [data-command]")].filter((e) => !e.closest("[hidden]")).map((e) => ({ ext: e.dataset.ext, command: e.dataset.command, tag: e.tagName.toLowerCase(), text: e.tagName === "SELECT" ? e.options[e.selectedIndex]?.textContent ?? null : e.textContent, title: e.title, options: e.tagName === "SELECT" ? [...e.options].map((o) => o.textContent) : null, rect: rectOf(e) })),
    /** pick an option on a toolbar picker by its text, as a person does (the select's value, then its change event) */
    pick(command, text) {
      const sel = host.querySelector(`.toolbar select[data-command="${command}"]`);
      const i = [...sel.options].findIndex((o) => o.textContent === text);
      if (i < 0) return false;
      sel.selectedIndex = i;
      sel.dispatchEvent(new Event("change", { bubbles: true }));
      return true;
    },
    /** the inspector as shown: its kind, the behaviours with their fields, and every command control in it */
    inspector() {
      const root = host.querySelector(".inspector");
      if (!root || root.closest("[hidden]")) return null;
      return {
        kind: root.dataset.kind ?? null,
        behaviours: [...root.querySelectorAll(".behaviour")].map((b) => ({ trait: b.dataset.trait, name: b.querySelector(".behaviour-name")?.textContent ?? null, fields: [...b.querySelectorAll("[data-kind]")].length })),
        commands: [...root.querySelectorAll("[data-command]")].map((e) => `${e.dataset.ext}/${e.dataset.command}`),
      };
    },
  };
} catch (e) {
  errors.push(`setup: ${e?.stack || e}`);
  window.__p = { errors };
}
</script>
