<!doctype html>
<meta charset="utf-8">
<title>tts-import probe</title>
<!-- Driven by probes/import-run.mjs. Mounts the BUILT tts-import tool (dist/)
     on a fresh tts-import doc in an in-memory repo, drops the mod's files on it
     (a real DataTransfer of Files, as a drop from the desktop would be), waits
     for the import, then mounts the BUILT scene tool (../scene/dist, loaded at
     runtime by URL — verification only, not a dependency) on the scene it made.
     window.__probe collects what the runner checks. -->
<script type="importmap">
{ "imports": { "@inkandswitch/patchwork-plugins": "./plugins-stub.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  body { display: flex; gap: 0; }
  #tool { width: 440px; height: 100%; flex: none; overflow: hidden; border-right: 1px solid #ccc; }
  #scene { flex: 1; height: 100%; position: relative; }
</style>
<div id="tool"></div><div id="scene"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "../src/test/fake-repo.js";

const probe = (window.__probe = { errors: [], phase: "start" });
window.addEventListener("error", (e) => probe.errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => probe.errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const params = new URLSearchParams(location.search);

try {
  for (const url of ["../dist/index.js", "/scene/dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  const repo = new FakeRepo();
  window.repo = repo;
  const Datatype = (await getRegistry("patchwork:datatype").load("tts-import")).module;
  const seed = { "@patchwork": { type: "tts-import" } };
  Datatype.init(seed);
  if (params.get("cardTexture")) seed.settings.cardTexture = Number(params.get("cardTexture"));
  seed.settings.fetchMissing = params.get("fetch") === "1";
  if (params.get("contents") === "0") seed.settings.includeContents = false;
  const importDoc = repo.add(seed);
  const toolHost = document.getElementById("tool");
  toolHost.repo = repo;
  const Tool = (await getRegistry("patchwork:tool").load("tts-import")).module;
  const opened = [];
  toolHost.addEventListener("patchwork:open-document", (e) => opened.push(e.detail));
  Tool(importDoc, toolHost);

  probe.phase = "fetching files";
  const manifest = await (await fetch("/manifest.json")).json();
  const files = await Promise.all(manifest.map(async (m) => new File([await (await fetch(m.url)).arrayBuffer()], m.name)));
  probe.files = files.length;
  const dt = new DataTransfer();
  for (const f of files) dt.items.add(f);
  const t0 = performance.now();
  probe.phase = "importing";
  toolHost.querySelector(".tts-import").dispatchEvent(new DragEvent("drop", { dataTransfer: dt, bubbles: true, cancelable: true }));
  for (let i = 0; i < 6000; i++) {
    const s = importDoc.doc().status;
    if (s === "done" || s === "error") break;
    await sleep(50);
  }
  const d = importDoc.doc();
  probe.importMs = Math.round(performance.now() - t0);
  probe.status = d.status;
  probe.error = d.error;
  probe.report = d.report && { counts: d.report.counts, warnings: d.report.warnings, notes: d.report.notes, missing: Object.values(d.report.assets).filter((a) => !a.source).map((a) => ({ url: a.url, usedBy: a.usedBy, error: a.error })) };
  probe.docs = repo.handles.size;
  probe.bytes = [...repo.handles.values()].reduce((n, h) => n + (h.doc()?.content?.byteLength ?? h.doc()?.content?.length ?? 0), 0);

  // the "Open the table" button
  toolHost.querySelector("button.primary")?.click();
  probe.opened = opened;
  if (d.status !== "done") throw new Error(`import ${d.status}: ${d.error}`);

  probe.phase = "mounting scene";
  const sceneHandle = await repo.find(d.sceneUrl);
  const scene = sceneHandle.doc();
  probe.scene = {
    objects: Object.keys(scene.objects).length,
    groups: Object.values(scene.objects).filter((o) => o.kind === "group").length,
    hiddenGroups: Object.values(scene.objects).filter((o) => o.kind === "group" && !o.visible).length,
    hiddenCards: Object.values(scene.objects).filter((o) => o.hidden).length,
    locked: Object.values(scene.objects).filter((o) => o.locked).length,
    seats: Object.keys(scene.seats ?? {}),
    view: scene.view,
    camera: scene.camera,
  };
  const sceneHost = document.getElementById("scene");
  sceneHost.repo = repo;
  sceneHost.viewerId = "viewer:probe";
  const SceneTool = (await getRegistry("patchwork:tool").load("scene")).module;
  // the same handle shape the hand probe uses (broadcast goes nowhere)
  SceneTool(sceneHandle, sceneHost);
  const dbg = sceneHost.querySelector(".scene-tool").__sceneDebug;
  const shown = (id) => {
    for (let o = scene.objects[id]; o; o = o.parent ? scene.objects[o.parent] : null) if (!o.visible) return false;
    return true;
  };
  const visible = Object.entries(scene.objects).filter(([id, o]) => o.kind !== "group" && shown(id)).length;
  for (let i = 0; i < 1200; i++) {
    const st = dbg.stats();
    if (st.loaded >= visible && st.pending === 0) break;
    await sleep(50);
  }
  probe.sceneStats = { ...dbg.stats(), visible };
  probe.camera = dbg.viewport.getCamera();
  window.__dbg = dbg;
  window.__scene = sceneHandle;
  probe.phase = "ready";
} catch (err) {
  probe.errors.push(`setup: ${err?.stack || err}`);
  probe.phase = "failed";
}
window.__ready = true;
</script>
