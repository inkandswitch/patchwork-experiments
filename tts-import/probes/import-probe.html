<!doctype html>
<meta charset="utf-8">
<title>tts-import probe</title>
<!-- Driven by probes/import-run.mjs. Mounts the BUILT tts-import tool (dist/)
     on a fresh tts-import doc in an in-memory repo, drops the mod's files on it
     (a real DataTransfer of Files, as a drop from the desktop would be), waits
     for the import, presses "Open the game", mounts the BUILT tabletop-game
     tool (../tabletop/dist) on the game it made, lets it draw every piece,
     presses "Set up a table", and mounts the BUILT scene tool on the table that
     opens, with the seats, keep, bag and dice packages installed (each from
     its own dist, loaded at runtime by URL: verification only, not a
     dependency). Nothing here is importer-specific past the drop: the table
     is set up as any game's is. window.__probe collects what the runner checks. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  body { display: flex; gap: 0; }
  #tool { width: 440px; height: 100%; flex: none; overflow: hidden; border-right: 1px solid #ccc; }
  #scene { flex: 1; height: 100%; position: relative; }
</style>
<div id="tool"></div><div id="scene"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "../src/test/fake-repo.js";

const probe = (window.__probe = { errors: [], phase: "start" });
window.addEventListener("error", (e) => probe.errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => probe.errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));
const params = new URLSearchParams(location.search);

try {
  for (const url of ["../dist/index.js", "/scene/dist/index.js", "/seats/dist/index.js", "/tabletop/dist/index.js", "/keep/dist/index.js", "/bag/dist/index.js", "/dice/dist/index.js"]) {
    const { plugins } = await import(url);
    for (const p of plugins) getRegistry(p.type).register(p);
  }
  const repo = new FakeRepo();
  window.repo = repo;
  const Datatype = (await getRegistry("patchwork:datatype").load("tts-import")).module;
  const seed = { "@patchwork": { type: "tts-import" } };
  Datatype.init(seed);
  seed.settings.fetchMissing = params.get("fetch") === "1";
  if (params.get("contents") === "0") seed.settings.includeContents = false;
  const importDoc = repo.add(seed);
  const toolHost = document.getElementById("tool");
  toolHost.repo = repo;
  const Tool = (await getRegistry("patchwork:tool").load("tts-import")).module;
  const opened = [];
  toolHost.addEventListener("patchwork:open-document", (e) => opened.push(e.detail));
  const unmountImport = Tool(importDoc, toolHost);

  probe.phase = "fetching files";
  const manifest = await (await fetch("/manifest.json")).json();
  const files = await Promise.all(manifest.map(async (m) => new File([await (await fetch(m.url)).arrayBuffer()], m.name)));
  probe.files = files.length;
  const dt = new DataTransfer();
  for (const f of files) dt.items.add(f);
  let t0 = performance.now();
  probe.phase = "importing";
  toolHost.querySelector(".tts-import").dispatchEvent(new DragEvent("drop", { dataTransfer: dt, bubbles: true, cancelable: true }));
  for (let i = 0; i < 6000; i++) {
    const s = importDoc.doc().status;
    if (s === "done" || s === "error") break;
    await sleep(50);
  }
  const d = importDoc.doc();
  probe.importMs = Math.round(performance.now() - t0);
  probe.status = d.status;
  probe.error = d.error;
  probe.report = d.report && { counts: d.report.counts, warnings: d.report.warnings, missing: Object.values(d.report.assets).filter((a) => !a.source).map((a) => ({ url: a.url, usedBy: a.usedBy, error: a.error })) };
  if (d.status !== "done") throw new Error(`import ${d.status}: ${d.error}`);

  // "Open the game": the tabletop-game tool on the game it made
  toolHost.querySelector("button.primary")?.click();
  probe.opened = [...opened];
  const gameHandle = await repo.find(d.gameUrl);
  probe.game = { pieces: Object.keys(gameHandle.doc().pieces).length, things: gameHandle.doc().setup.length, origin: gameHandle.doc().origin, seats: Object.keys(gameHandle.doc().seats ?? {}) };
  unmountImport();
  const gameOpened = [];
  toolHost.addEventListener("patchwork:open-document", (e) => gameOpened.push(e.detail));
  const GameTool = (await getRegistry("patchwork:tool").load("tabletop-game")).module;
  GameTool(gameHandle, toolHost);
  probe.phase = "drawing pieces";
  t0 = performance.now();
  for (let i = 0; i < 12000; i++) {
    const g = gameHandle.doc();
    if (Object.keys(g.drawn ?? {}).length >= Object.keys(g.pieces).length && !/Drawing/.test(toolHost.querySelector(".status")?.textContent ?? "")) break;
    await sleep(50);
  }
  probe.drawMs = Math.round(performance.now() - t0);
  probe.drawn = Object.keys(gameHandle.doc().drawn ?? {}).length;
  probe.drawStatus = toolHost.querySelector(".status")?.textContent ?? "";
  probe.drawnOrigins = Object.values(gameHandle.doc().drawn ?? {}).filter((f) => repo.handles.get(f.url)?.doc()?.origin?.urls?.length).length;

  probe.phase = "setting up a table";
  [...toolHost.querySelectorAll("button")].find((b) => b.textContent === "Set up a table").click();
  for (let i = 0; i < 2400 && !gameOpened.length; i++) await sleep(50);
  probe.tableOpened = gameOpened[0] ?? null;
  probe.setUpStatus = toolHost.querySelector(".status")?.textContent ?? "";
  if (!gameOpened.length) throw new Error(`no table: ${probe.setUpStatus}`);

  probe.phase = "mounting scene";
  const sceneHandle = await repo.find(gameOpened[0].url);
  const scene = sceneHandle.doc();
  const objs = Object.values(scene.objects);
  const cards = objs.filter((o) => o.traits?.["tabletop.card"]);
  probe.scene = {
    objects: objs.length,
    placed: objs.filter((o) => o.kind !== "group").length,
    locked: objs.filter((o) => o.locked).length,
    carryable: objs.filter((o) => o.kind !== "group" && o.traits?.["scene.carry"]).length,
    cards: cards.length,
    keptCards: cards.filter((o) => o.traits?.["keep.plain"]?.by).length,
    hands: objs.filter((o) => o.traits?.["tabletop.zone"]).map((o) => o.traits["tabletop.zone"].seat),
    bags: objs.filter((o) => o.traits?.["bag.container"]?.doc).length,
    dice: objs.filter((o) => o.traits?.["dice.die"]).length,
    seats: Object.keys(scene.traits.seats ?? {}),
    origin: scene.origin ?? null,
    view: scene.view,
    patchwork: scene["@patchwork"],
  };
  const sceneHost = document.getElementById("scene");
  sceneHost.repo = repo;
  sceneHost.viewerId = "viewer:probe";
  const SceneTool = (await getRegistry("patchwork:tool").load("scene")).module;
  SceneTool(sceneHandle, sceneHost);
  const dbg = sceneHost.querySelector(".scene-tool").__sceneDebug;
  const shown = (id, seen = new Set()) => {
    const o = scene.objects[id];
    if (!o || seen.has(id)) return true;
    seen.add(id);
    return o.visible !== false && (o.group == null || shown(o.group, seen)) && (o.parent == null || shown(o.parent, seen));
  };
  const visible = Object.entries(scene.objects).filter(([id, o]) => o.kind !== "group" && shown(id)).length;
  for (let i = 0; i < 2400; i++) {
    const st = dbg.stats();
    if (st.loaded >= visible && st.pending === 0) break;
    await sleep(50);
  }
  probe.sceneStats = { ...dbg.stats(), visible };
  probe.camera = dbg.viewport.getCamera();
  window.__dbg = dbg;
  window.__scene = sceneHandle;
  // for the runner's play step: sit in a seat, find a pile, aim at its top card, read the use prompt
  const cardsOut = () => {
    const snap = dbg.scene();
    const zones = Object.entries(snap.objects).filter(([, o]) => o.traits?.["tabletop.zone"]);
    const inHand = (id) => zones.find(([zid, z]) => {
      const m = snap.world(id), h = snap.world(zid);
      const reach = Math.max(...z.traits["tabletop.zone"].max.map(Math.abs), ...z.traits["tabletop.zone"].min.map(Math.abs));
      return Math.hypot(m[12] - h[12], m[14] - h[14]) <= reach;
    })?.[0] ?? null;
    return { snap, inHand };
  };
  window.__play = {
    seat() {
      const sid = Object.keys(sceneHandle.doc().traits.seats ?? {})[0];
      if (!sid) return null;
      sceneHandle.change((d) => (d.traits.seats[sid].player = sceneHost.viewerId));
      return sid;
    },
    /** the piles of kept cards out on the table (cards of one container on one spot), biggest first, each top first */
    piles() {
      const { snap, inHand } = cardsOut();
      const spots = {};
      for (const [id, o] of Object.entries(snap.objects)) {
        const by = o.traits?.["keep.plain"]?.by;
        if (!by || !o.traits["tabletop.card"] || inHand(id)) continue;
        const m = snap.world(id);
        (spots[`${by} ${m[12].toFixed(3)},${m[14].toFixed(3)}`] ??= []).push(id);
      }
      return Object.values(spots).filter((p) => p.length >= 2).map((p) => p.sort((a, b) => snap.world(b)[13] - snap.world(a)[13])).sort((a, b) => b.length - a.length);
    },
    handOf: (id) => cardsOut().inHand(id),
    world: (id) => [...dbg.scene().world(id)],
    look(id) {
      const m = dbg.scene().world(id);
      dbg.viewport.setCamera({ position: [m[12], m[13] + 0.35, m[14] + 0.25], target: [m[12], m[13], m[14]] });
      dbg.viewport.invalidate?.();
      return true;
    },
    aimAt(id) {
      const v = dbg.viewport;
      const r = v.canvas.getBoundingClientRect();
      const m = v.worldOf(id);
      const p = m && v.project([m[12], m[13], m[14]]);
      if (!p) return null;
      for (let k = 0; k < 900; k++) {
        const a = k * 0.6, rad = 2 * Math.sqrt(k);
        const x = p.x + rad * Math.cos(a), y = p.y + rad * Math.sin(a);
        if (x < 2 || y < 2 || x > r.width - 2 || y > r.height - 2) continue;
        if (v.pick(x, y)?.id === id) return { x: r.left + x, y: r.top + y };
      }
      return null;
    },
    hovered: () => dbg.local.get().hovered ?? null,
    prompt: () => [...sceneHost.querySelectorAll(".use-prompt .use-verb")].map((e) => e.textContent.trim()),
    focus() { const r = sceneHost.querySelector(".scene-stage"); r.focus(); return r.contains(document.activeElement) || document.activeElement === r; },
    audience: (id) => dbg.audience(id),
  };
  probe.phase = "ready";
} catch (err) {
  probe.errors.push(`setup: ${err?.stack || err}`);
  probe.phase = "failed";
}
window.__ready = true;
</script>
