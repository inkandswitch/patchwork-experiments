<!doctype html>
<meta charset="utf-8" />
<title>machine browser probe</title>
<body>
<script>
  // Errors before the module runs (a failed import) still reach the runner.
  const say = (x) => fetch("/log", { method: "POST", body: String(x) });
  addEventListener("error", (e) => say(e.message));
  addEventListener("unhandledrejection", (e) => say(e.reason?.stack ?? e.reason));
  say("page loaded");
</script>
<script type="module">
  // Runs scenario.js in the browser and posts what it found, frames as PNGs.
  import { scenario } from "./scenario.js";
  const report = (x) => fetch("/report", { method: "POST", body: JSON.stringify(x) });
  const pngs = {};
  try {
    const load = async (path) => {
      const r = await fetch(`/${path}`);
      if (!r.ok) throw new Error(`${path}: ${r.status}`);
      return new Uint8Array(await r.arrayBuffer());
    };
    const draw = (name, f) => {
      const c = document.createElement("canvas");
      c.width = f.width;
      c.height = f.height;
      c.getContext("2d").putImageData(new ImageData(f.rgba, f.width, f.height), 0, 0);
      document.body.append(c);
      pngs[name] = c.toDataURL("image/png");
    };
    const result = await scenario({ load, now: () => performance.now(), draw });
    await report({ ok: true, userAgent: navigator.userAgent, result, pngs });
  } catch (err) {
    await report({ ok: false, fatal: String(err?.stack || err) });
  }
</script>
