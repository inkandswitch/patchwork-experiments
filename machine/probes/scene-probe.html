<!doctype html>
<meta charset="utf-8">
<title>machine in a scene probe</title>
<!-- Driven by probes/scene.mjs. The BUILT scene tool (scene/dist) with the
     BUILT machine package (machine/dist) in a stub registry, on REAL Automerge
     documents: two peers, each with its own replica of every doc
     (probes/real-repo.js), a change or a message reaching the other a little
     later. Two machine docs wait in peer a's repo (Doom on Freedoom's E1M1,
     one player; the Super NES on Unarmed) for the runner to paste into the
     scene.
       #a  view A (Ana) of the scene, on peer a
       #b  view B (Ben) of the scene, on peer b -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "../node_modules/@automerge/automerge/dist/mjs/entrypoints/fullfat_base64.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; background: #222; overflow: hidden; }
  body { display: grid; grid-template-columns: 720px 720px; grid-template-rows: 560px; gap: 8px; }
  #a, #b { position: relative; overflow: hidden; }
</style>
<div id="a"></div><div id="b"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { twoPeers } from "./real-repo.js";
import { content as doomContent } from "../src/doom.js";
import { worldClock, tickAt } from "../src/host/clock.js";
import { directory, mapLumps, sectorFinder } from "../src/present/doom-world.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const origWarn = console.warn, origError = console.error;
console.warn = (...a) => { errors.push(`warn: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origWarn(...a); };
console.error = (...a) => { errors.push(`error: ${a.map((x) => x?.stack ?? String(x)).join(" ")}`); origError(...a); };

// What the page plays, read from WebAudio itself (the extension has no
// surface for probes): every context made, every panner, and every buffer
// source started, with its context and how loud its buffer is.
const audio = { contexts: [], panners: [], started: [] };
{
  const AC = window.AudioContext;
  window.AudioContext = class extends AC {
    constructor(...a) { super(...a); audio.contexts.push(this); }
    createPanner() { const p = super.createPanner(); p.__ctx = audio.contexts.indexOf(this); audio.panners.push(p); return p; }
  };
  const start = AudioBufferSourceNode.prototype.start;
  AudioBufferSourceNode.prototype.start = function (...a) {
    const b = this.buffer;
    let peak = 0;
    if (b) for (let c = 0; c < b.numberOfChannels; c++) for (const v of b.getChannelData(c)) peak = Math.max(peak, Math.abs(v));
    audio.started.push({ ctx: audio.contexts.findIndex((c) => c === this.context), rate: b?.sampleRate ?? 0, frames: b?.length ?? 0, peak });
    return start.apply(this, a);
  };
}
// ?seats: the seats package too (probes/seats.mjs). The doom package, which builds Doom's maps (probes/world.mjs), is
// installed when the probe asks (__p.install("doom")), after the machine's extension has started, as a package listed on a
// scene doc may load after another one
const SEATS = new URLSearchParams(location.search).has("seats");
const install = async (url) => {
  const { plugins } = await import(url);
  for (const p of plugins) getRegistry(p.type).register(p);
};

try {
  for (const url of ["../../scene/dist/index.js", ...(SEATS ? ["../../seats/dist/index.js"] : []), "../dist/index.js"]) await install(url);
  const time = window.__time = (await (await import("../../scene/dist/index.js")).loadTime()).manualTime();
  const net = twoPeers({ delay: 25, later: (ms, fn) => time.after(ms, fn) }); // the network on the page's clock too
  const ana = await net.a.create2({ "@patchwork": { type: "contact" }, name: "Ana" });
  const ben = await net.a.create2({ "@patchwork": { type: "contact" }, name: "Ben" });
  const wad = new Uint8Array(await (await fetch("/wad")).arrayBuffer());
  const rom = new Uint8Array(await (await fetch("../engines/snes/test/unarmed.sfc")).arrayBuffer());
  // what each machine boots, as the Machine tool writes it: Doom's start arguments and WAD; a ROM
  const doomBytes = doomContent({ wads: [wad], args: ["-skill", "3", "-warp", "1", "1", "-players", "1"] });
  window.__doomArgs = { skill: 3, players: 1 };
  const doomRuns = await net.a.create2({ title: "freedoom1 · E1M1 · 1p", bytes: doomBytes });
  const snesRuns = await net.a.create2({ title: "unarmed", bytes: rom });
  const machines = {
    doom: await net.a.create2({ "@patchwork": { type: "machine" }, title: "Freedoom", kind: "doom", content: doomRuns.url }),
    snes: await net.a.create2({ "@patchwork": { type: "machine" }, title: "Unarmed", kind: "snes", content: snesRuns.url }),
  };
  const scene = { a: await net.a.create2({
    "@patchwork": { type: "scene" }, title: "Machines", objects: {}, order: [], dimensions: {}, traits: {}, assets: {}, packages: [],
    clock: { running: true, t: 0 },
    view: { units: "m", grid: false, axes: false, bounds: false, snap: true, start: { edit: true } },
  }) };
  scene.b = await net.b.find(scene.a.url);
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const hosts = { a: document.getElementById("a"), b: document.getElementById("b") };
  hosts.a.repo = net.a; hosts.b.repo = net.b;
  hosts.a.viewerId = ana.url; hosts.b.viewerId = ben.url;
  for (const h of Object.values(hosts)) h.time = time;
  Tool(scene.a, hosts.a);
  Tool(scene.b, hosts.b);
  const dbg = { a: hosts.a.querySelector(".scene-stage").__sceneDebug, b: hosts.b.querySelector(".scene-stage").__sceneDebug };
  const docOf = (w) => scene[w].doc();
  const rootOf = (w) => hosts[w].querySelector(".scene-stage");
  const machineApi = (w) => dbg[w].host.record("machine")?.api ?? null;

  // What a machine on view w shows, read without the extension's help (it has
  // no surface for probes): the screen mesh in the stage's scene graph and the
  // texture it draws, and the tick from that view's own replica of the session
  // and its own world time, through this package's clock (the tick the host
  // steps to). FNV-1a of the drawn bytes, to compare two views' pictures.
  const fnv = (rgba) => {
    let h = 0x811c9dc5;
    for (let i = 0; i < rgba.length; i += 7) h = Math.imul(h ^ rgba[i], 0x01000193);
    return (h >>> 0).toString(16);
  };
  const uniform = (rgba) => {
    for (let i = 4; i < rgba.length; i += 4) if (rgba[i] !== rgba[0] || rgba[i + 1] !== rgba[1] || rgba[i + 2] !== rgba[2]) return false;
    return true;
  };
  const screenMesh = (w, id) => {
    const vp = dbg[w].viewport;
    return vp.scene?.getObjectByName(`machine.screen:${id}`) ?? vp.topScene?.getObjectByName(`machine.screen:${id}`) ?? null;
  };
  const replicas = { a: new Map(), b: new Map() }; // session url -> handle | null (being found), per peer
  const replica = (w, url) => {
    if (!replicas[w].has(url)) {
      replicas[w].set(url, null);
      net[w].find(url).then((h) => replicas[w].set(url, h));
    }
    return replicas[w].get(url);
  };
  function shows(w) {
    const out = {};
    for (const [id, o] of Object.entries(docOf(w).objects ?? {})) {
      const t = o?.traits?.machine;
      if (!t) continue;
      const h = t.session ? replica(w, t.session) : null;
      const s = h?.doc();
      if (!s?.engine) {
        out[id] = { tick: null, running: false, shown: null };
        continue;
      }
      const clock = worldClock(h, { t: () => dbg[w].view.outermost().reader.use("clock").t(), running: () => docOf(w).clock?.running !== false });
      const tick = tickAt(clock, s.engine.hz);
      const mesh = screenMesh(w, id);
      const img = mesh?.material?.map?.image;
      // drawn once the mesh is placed; a machine that has drawn nothing yet shows black, 1 by 1, until its poster is found;
      // blank: one colour all over (as present/poster.js says)
      const shown = mesh?.visible && img?.data ? { tick, hash: fnv(img.data), size: [img.width, img.height], blank: uniform(img.data) } : null;
      out[id] = { tick, running: clock.running(), shown };
    }
    return out;
  }

  // The screen against the cabinet as the stage draws it: the quad's corners
  // (the mesh's world matrix) and the bezel's front face (the GLB's own
  // vertices, through its node's world matrix). The screen is the bezel's
  // face inset by the bezel's width and standing just proud of it.
  function placement(w, id) {
    const mesh = screenMesh(w, id);
    const root = machineApi(w)?.content(id)?.root;
    if (!mesh || !root) return null;
    let bezel = null;
    root.traverse((n) => { if (!bezel && n.isMesh && (n.name === "bezel" || n.parent?.name === "bezel")) bezel = n; });
    if (!bezel) return null;
    const V = mesh.position.constructor;
    mesh.updateWorldMatrix(true, false);
    bezel.updateWorldMatrix(true, false);
    const quad = [[-0.5, -0.5], [0.5, -0.5], [0.5, 0.5], [-0.5, 0.5]].map(([x, y]) => new V(x, y, 0).applyMatrix4(mesh.matrixWorld));
    const pos = bezel.geometry.getAttribute("position");
    let zmax = -Infinity;
    for (let i = 0; i < pos.count; i++) zmax = Math.max(zmax, pos.getZ(i));
    const face = [];
    for (let i = 0; i < pos.count; i++) {
      if (Math.abs(pos.getZ(i) - zmax) > 1e-6) continue;
      const v = new V(pos.getX(i), pos.getY(i), pos.getZ(i)).applyMatrix4(bezel.matrixWorld);
      if (!face.some((f) => f.distanceTo(v) < 1e-6)) face.push(v);
    }
    const mid = (ps) => ps.reduce((a, p) => a.add(p), new V()).multiplyScalar(1 / ps.length);
    return {
      // each corner of the picture to the nearest corner of the bezel's face
      corners: quad.map((q) => Math.min(...face.map((f) => f.distanceTo(q)))),
      centres: mid(quad).distanceTo(mid(face)),
      faceCorners: face.length,
      world: machineApi(w).worldOf(id),
    };
  }

  // every write to the scene doc (as peer a has it): how many, to show the machine writes nothing there while it plays
  const writes = [];
  scene.a.on("change", () => writes.push(Math.round(performance.now())));

  // A machine's world (probes/world.mjs), read from the stage without the
  // extension's help: the map object's content (its extras, its door nodes,
  // its floors, as doom/ built them) and the scene graph's things (the
  // groups named thing:<id> in machine.world:<map id>), each in map units
  // through the map's own frame (extras.doom: anchor, unitsPerMetre).
  function worldView(w, wid) {
    const api = machineApi(w);
    const c = api?.content(wid);
    const doom = c?.loaded ? c.extras?.doom : null;
    const vp = dbg[w].viewport;
    const group = vp.scene?.getObjectByName(`machine.world:${wid}`) ?? null;
    if (!doom || !group) return null;
    const T = api.THREE;
    const k = doom.unitsPerMetre;
    const [ax, ay, az] = doom.anchor;
    c.root.updateWorldMatrix(true, true);
    const units = (p) => { const l = c.root.worldToLocal(p.clone()); return [l.x * k + ax, -l.z * k + ay, l.y * k + az]; };
    const ray = new T.Raycaster();
    const scale = new T.Vector3().setFromMatrixScale(c.root.matrixWorld).x;
    const things = group.children.map((h) => {
      h.updateWorldMatrix(true, false);
      const p = new T.Vector3().setFromMatrixPosition(h.matrixWorld);
      // the floor doom/ drew under its feet: straight down from a little above them, at the
      // feet and half a unit to each side (a thing centred on a line between two floors is in
      // the sector Doom's BSP says, which a ray straight down the line can't tell)
      const floors = [[0, 0], [0.5, 0], [-0.5, 0], [0, 0.5], [0, -0.5]].map(([dx, dz]) => {
        const o = c.root.localToWorld(c.root.worldToLocal(p.clone()).add(new T.Vector3(dx / k, 0, dz / k)));
        ray.set(o.add(new T.Vector3(0, 0.25 * scale, 0)), new T.Vector3(0, -1, 0));
        const hit = ray.intersectObject(c.root, true)[0];
        return hit ? units(hit.point)[2] : null;
      }).filter((f) => f !== null);
      return { id: h.userData.id, lump: h.userData.lump ?? null, at: units(p), floors };
    });
    const doors = [];
    c.root.traverse((n) => { if (Number.isInteger(n.userData?.door)) doors.push({ door: n.userData.door, y: n.position.y * k }); });
    return { map: doom.map, scale, world: api.worldOf(wid), things, doors };
  }
  // What a game on this WAD's map spawns at its start (P_SpawnMapThing, p_mobj.c): its THINGS for
  // the skill (bit 1, 2 or 4) in one player's game, no deathmatch starts, player 1's start alone,
  // nothing multiplayer-only (flag 16); a teleport destination (14) is NOSECTOR, never drawn.
  function spawns(map, { skill, players = 1 }) {
    const t = mapLumps(directory(wad), map).THINGS;
    const v = new DataView(t.buffer, t.byteOffset, t.byteLength);
    const bit = skill <= 2 ? 1 : skill >= 4 ? 4 : 2;
    const out = [];
    for (let at = 0; at + 10 <= t.length; at += 10) {
      const [x, y, angle, type, flags] = [0, 2, 4, 6, 8].map((o) => v.getInt16(at + o, true));
      if (type === 11 || type === 14) continue;
      if (type >= 1 && type <= 4) { if (type <= players) out.push({ x, y, angle, type }); continue; }
      if (players === 1 && flags & 16) continue;
      if (!(flags & bit)) continue;
      out.push({ x, y, angle, type });
    }
    return out;
  }
  // E1M1's door sectors' floors, where each door shuts (map units), from the WAD
  function floors(map) {
    const s = mapLumps(directory(wad), map).SECTORS;
    const v = new DataView(s.buffer, s.byteOffset, s.byteLength);
    return Array.from({ length: s.length / 26 }, (_, i) => v.getInt16(i * 26, true));
  }

  // the sector Doom's BSP puts a point in (map units)
  const finders = new Map();
  const sectorOf = (map, x, y) => {
    if (!finders.has(map)) finders.set(map, sectorFinder(mapLumps(directory(wad), map)));
    return finders.get(map)(Math.round(x * 65536), Math.round(y * 65536));
  };

  // The floor Doom stands a body of radius r at (x, y) on, from the WAD (map units, sectors at rest): the highest floor of its
  // centre's sector and of both sides of every line its box crosses (P_CheckPosition and PIT_CheckLine, p_map.c; the box
  // test P_BoxOnLineSide, p_maputl.c), and the sectors those are. Things are left out (a body stands on the floor here).
  const linesOf = new Map();
  function floorUnder(map, x, y, r) {
    if (!linesOf.has(map)) {
      const m = mapLumps(directory(wad), map);
      const dv = (b) => new DataView(b.buffer, b.byteOffset, b.byteLength);
      const V = dv(m.VERTEXES), L = dv(m.LINEDEFS), S = dv(m.SIDEDEFS), F = dv(m.SECTORS);
      const vx = (i) => [V.getInt16(i * 4, true), V.getInt16(i * 4 + 2, true)];
      const sectorOfSide = (sd) => (sd === 0xffff ? null : S.getUint16(sd * 30 + 28, true));
      const lines = Array.from({ length: m.LINEDEFS.length / 14 }, (_, i) => {
        const [x1, y1] = vx(L.getUint16(i * 14, true));
        const [x2, y2] = vx(L.getUint16(i * 14 + 2, true));
        return { x1, y1, dx: x2 - x1, dy: y2 - y1, box: [Math.min(x1, x2), Math.max(x1, x2), Math.min(y1, y2), Math.max(y1, y2)], sectors: [sectorOfSide(L.getUint16(i * 14 + 10, true)), sectorOfSide(L.getUint16(i * 14 + 12, true))] };
      });
      linesOf.set(map, { lines, floor: (s) => F.getInt16(s * 26, true) });
    }
    const { lines, floor } = linesOf.get(map);
    const side = (l, px, py) => ((py - l.y1) * l.dx - (px - l.x1) * l.dy >= 0 ? 1 : 0); // R_PointOnLineSide's cross product: 1 back, 0 front
    const [left, right, bottom, top] = [x - r, x + r, y - r, y + r];
    const sectors = [sectorOf(map, x, y)];
    for (const l of lines) {
      if (right <= l.box[0] || left >= l.box[1] || top <= l.box[2] || bottom >= l.box[3]) continue;
      let p1, p2;
      if (l.dy === 0) [p1, p2] = l.dx > 0 ? [top > l.y1, bottom > l.y1] : [!(top > l.y1), !(bottom > l.y1)];
      else if (l.dx === 0) [p1, p2] = l.dy > 0 ? [right < l.x1, left < l.x1] : [!(right < l.x1), !(left < l.x1)];
      else if (l.dx * l.dy > 0) [p1, p2] = [side(l, left, top), side(l, right, bottom)];
      else [p1, p2] = [side(l, right, top), side(l, left, bottom)];
      if (+p1 === +p2) continue; // the box is wholly on one side
      for (const s of l.sectors) if (s !== null) sectors.push(s);
    }
    return { floor: Math.max(...sectors.map(floor)), sectors: [...new Set(sectors)] };
  }

  // a point in map units, in the world (the map's frame, as its content says), for the camera
  function toWorld(w, wid, [x, y, z]) {
    const c = machineApi(w)?.content(wid);
    const doom = c?.extras?.doom;
    if (!doom) return null;
    const [ax, ay, az] = doom.anchor;
    const k = doom.unitsPerMetre;
    c.root.updateWorldMatrix(true, false);
    return c.root.localToWorld(new (machineApi(w).THREE.Vector3)((x - ax) / k, (z - az) / k, -(y - ay) / k)).toArray();
  }

  window.__p = {
    install: (name) => install({ doom: "../../doom/dist/index.js" }[name]),
    floorUnder,
    worldView,
    sectorOf,
    toWorld,
    spawns,
    floors,
    worldId: (w = "a") => Object.entries(docOf(w).objects ?? {}).find(([, o]) => o?.traits?.["machine.world"])?.[0] ?? null,
    object: (id, w = "a") => JSON.parse(JSON.stringify(docOf(w).objects?.[id] ?? null)),
    run: (w, command, target) => machineApi(w).run({ ext: "machine", command, target }),
    commandState(w, command, target) {
      const rec = dbg[w].host.record("machine");
      const c = rec?.instance?.commands?.find((x) => x.id === command);
      return c ? c.state(target, machineApi(w).context()) : "no command";
    },
    setObject: (id, transform) => scene.a.change((d) => { d.objects[id].transform = transform; }),
    errors, machines: { doom: machines.doom.url, snes: machines.snes.url },
    doc: (w = "a") => JSON.parse(JSON.stringify(docOf(w))),
    writes: () => writes.length,
    paste(w, text) {
      const dt = new DataTransfer();
      dt.setData("text/plain", text);
      rootOf(w).dispatchEvent(new ClipboardEvent("paste", { clipboardData: dt, bubbles: true, cancelable: true }));
    },
    running: (w) => (dbg[w]?.local.get().running ?? []).map((r) => r.id),
    byUrl: (url, w = "a") => Object.entries(docOf(w).objects ?? {}).find(([, o]) => o.sourceUrl === url)?.[0] ?? null,
    trait: (id, w = "a") => JSON.parse(JSON.stringify(docOf(w).objects?.[id]?.traits?.machine ?? null)),
    setTransform: (id, position, rotation = [0, 0, 0]) => scene.a.change((d) => { d.objects[id].transform = { position, rotation, scale: 1 }; }),
    /** what each machine on view w shows: { [id]: { tick, running, shown: { tick, hash, size } | null } } */
    shows,
    placement,
    session: async (url) => { const h = await net.a.find(url); const d = h.doc(); return { clock: JSON.parse(JSON.stringify(d.clock)), seats: JSON.parse(JSON.stringify(d.seats ?? {})), checkpoints: Object.keys(d.checkpoints ?? {}).length }; },
    clock: (w) => ({ t: dbg[w].view.outermost().reader.use("clock").t(), computing: !!dbg[w].view.outermost().reader.use("clock").computer()?.mine, doc: JSON.parse(JSON.stringify(docOf(w).clock ?? null)) }),
    held: (w) => dbg[w].local.get().held ?? null,
    // the view's selection (api.view, what extensions read as attention), through an extension's api
    select: (w, id) => machineApi(w).view.select(id),
    selected: (w) => machineApi(w).view.get().selected ?? null,
    notices: (w) => (dbg[w].local.get().notices ?? []).map((n) => n.text),
    labels: (w) => [...hosts[w].querySelectorAll(".machine-note")].map((e) => e.textContent),
    loaded(w) {
      const os = Object.entries(docOf(w).objects ?? {});
      return { total: os.length, loaded: os.filter(([id]) => dbg[w]?.viewport.contentOf(id)?.loaded).length };
    },
    setCamera: (w, c) => dbg[w].viewport.setCamera(c),
    // the seats probe: the parts bin's part, a file dropped on the port, the seats picker, the body, the camera, the seats' input docs, the sound
    rom: () => rom.length,
    async part(w, at) {
      const host = dbg[w].host;
      const api = host.running().map((r) => host.record(r.id)?.api).find((a) => typeof a?.part === "function");
      return api.part("machine", at);
    },
    dropFile(w, name, x, y) {
      const dt = new DataTransfer();
      dt.items.add(new File([rom], name));
      const canvas = dbg[w].viewport.canvas;
      canvas.dispatchEvent(new DragEvent("drop", { dataTransfer: dt, clientX: x, clientY: y, bubbles: true, cancelable: true }));
    },
    machineDoc: async (url) => { const d = (await net.a.find(url)).doc(); return { kind: d.kind ?? null, title: d.title, content: d.content ?? null }; },
    pickSeat(w, sid) {
      const select = hosts[w].querySelector("select.seats-pick");
      select.value = sid;
      select.dispatchEvent(new Event("change"));
      return select.value;
    },
    seatOptions: (w) => [...(hosts[w].querySelector("select.seats-pick")?.options ?? [])].map((o) => [o.value, o.textContent]),
    body: (w) => dbg[w].local.get().body?.id ?? null,
    // the play probe: a body entered (Look), the use prompt's verbs, the controls panel, the seat the roster says this view sits in
    enter: (w, body) => dbg[w].host.running().map((r) => dbg[w].host.record(r.id)?.api).find((a) => a?.body?.enter)?.body.enter(body) ?? null,
    /** pick up the editor or put it down (a hand, not a body), and whether view w holds it */
    edit: (w, on) => dbg[w].view.focusStage().reader.run({ ext: "scene.edit", command: "edit", target: null, value: on }),
    editing: (w) => (dbg[w].local.get().hands ?? []).some((h) => h.kind === "edit"),
    prompt: (w) => [...hosts[w].querySelectorAll(".use-prompt:not([hidden]) .use-verb")].map((v) => { const r = v.getBoundingClientRect(); return { text: v.textContent.trim(), disabled: v.disabled, title: v.title, x: r.left + r.width / 2, y: r.top + r.height / 2 }; }),
    controls: (w) => { const c = hosts[w].querySelector(".machine-controls"); const keys = c?.querySelector(".machine-controls-keys"); return c && !c.hidden ? { title: c.querySelector(".machine-controls-title")?.textContent, rows: [...c.querySelectorAll(".machine-controls-key")].map((k) => [[...k.querySelectorAll("kbd")].map((x) => x.textContent).join(""), k.querySelector(":scope > span")?.textContent]), foot: c.querySelector(".machine-controls-foot")?.textContent, folded: c.classList.contains("folded"), keysShown: !!keys && getComputedStyle(keys).display !== "none", box: (({ left, top, right, bottom }) => [left, top, right, bottom])(c.getBoundingClientRect()) } : null; },
    sitting: (w) => dbg[w].host.record("seats")?.instance?.roster?.sitting?.() ?? null,
    // Doom: the ticcmds port `port`'s seats wrote (forwardmove, the int8 at 0; angleturn, the int16 at 2): how many ticks moved, how many turned
    async ticcmds(url, port) {
      const s = (await net.a.find(url)).doc();
      const n = s.engine.inputBytes;
      const out = { ticks: 0, forward: 0, turn: 0 };
      for (const seat of Object.values(s.seats ?? {})) {
        if (seat.port !== port) continue;
        const d = (await net.a.find(seat.inputs)).doc();
        for (const b of Object.values(d?.chunks ?? {}))
          for (let i = 0; i + n <= b.length; i += n) {
            out.ticks++;
            if (((b[i] << 24) >> 24) > 0) out.forward++;
            if (((b[i + 2] | (b[i + 3] << 8)) << 16) >> 16 !== 0) out.turn++;
          }
      }
      return out;
    },
    eye: (w) => dbg[w].viewport.camera.position.toArray(),
    focus: (w) => rootOf(w).focus(),
    async inputs(url) {
      const s = (await net.a.find(url)).doc();
      const out = [];
      for (const [id, seat] of Object.entries(s.seats ?? {})) {
        const d = (await net.a.find(seat.inputs)).doc();
        let bits = 0, chunks = 0;
        for (const b of Object.values(d?.chunks ?? {})) {
          chunks++;
          for (let i = 0; i + 1 < b.length; i += 2) bits |= b[i] | (b[i + 1] << 8);
        }
        out.push({ id, port: seat.port, by: seat.by ?? null, until: seat.until ?? null, chunks, bits });
      }
      return out;
    },
    audio: () => ({
      contexts: audio.contexts.length,
      panners: audio.panners.map((p) => ({ ctx: p.__ctx, at: [p.positionX.value, p.positionY.value, p.positionZ.value] })),
      listeners: audio.contexts.map((c) => [c.listener.positionX.value, c.listener.positionY.value, c.listener.positionZ.value]),
      started: audio.contexts.map((c, i) => { const s = audio.started.filter((x) => x.ctx === i); return { n: s.length, loud: s.filter((x) => x.peak > 0.001).length, rates: [...new Set(s.map((x) => x.rate))], rate: c.sampleRate }; }),
    }),
    viewers: { a: ana.url, b: ben.url },
    project: (w, p) => { const q = dbg[w].viewport.project(p); const r = dbg[w].viewport.canvas.getBoundingClientRect(); return q && { x: r.left + q.x, y: r.top + q.y, visible: q.visible }; },
  };
  window.__ready = true;
} catch (e) {
  errors.push(`setup: ${e.stack || e}`);
  window.__ready = true;
}
</script>
