<!doctype html>
<meta charset="utf-8">
<title>scene hand probe</title>
<!-- Also a scene extension (registered here, as a `scene:extension` plugin):
     a lens that shows a card's secret face to whoever sits at the tray (a
     scene trait) when it's in the tray, and to everyone when it's face up; a
     Shuffle command on S; a landing hook that turns a card face up over the
     tray; a panel. A stand-in for the tabletop package's, which this package
     can't import. Viewer A and viewer B are told apart by element.viewerId.
     Written to STAGE.md's extension contract (looks, landing, commands with
     state, panels, api.notify). -->
<!-- Driven by probes/hand-run.mjs: two scene tools on one doc (each peer's
     broadcasts reach only the other), a 5×5 board GLB with extras.snapPoints
     (locked), blocks and pawns, all loaded through the BUILT tool (dist/). The
     runner carries pieces with a real mouse over CDP. -->
<script type="importmap">
{ "imports": { "@inkandswitch/patchwork-plugins": "./plugins-stub.js", "@automerge/automerge": "./automerge-stub.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  body { display: flex; gap: 8px; }
  #a { width: 860px; height: 640px; flex: none; position: relative; }
  #b { width: 520px; height: 420px; flex: none; position: relative; }
</style>
<div id="a"></div><div id="b"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "../src/test/fake-repo.js";
import { encodeGLB } from "../src/glb.js";

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

// two peers on one doc: each tool gets a view of the handle whose broadcasts reach only the other
function peer(handle) {
  const eph = new Set();
  const p = {
    url: handle.url,
    doc: () => handle.doc(),
    heads: () => handle.heads(),
    change: (fn) => handle.change(fn),
    on: (ev, fn) => (ev === "ephemeral-message" ? eph.add(fn) : handle.on(ev, fn)),
    off: (ev, fn) => (ev === "ephemeral-message" ? eph.delete(fn) : handle.off(ev, fn)),
    broadcast: (message) => setTimeout(() => { for (const fn of p.other.eph) fn({ message, senderId: "peer" }); }, 5),
    eph,
  };
  return p;
}

try {
  const { plugins } = await import("../dist/index.js");
  for (const p of plugins) getRegistry(p.type).register(p);
  const repo = new FakeRepo();
  window.repo = repo;
  // a box standing on y = 0 as six quads (no normals needed: flat shading is fine for probing)
  const box = (w, h, d, color, at = [0, 0, 0]) => {
    const [x, y, z] = at, a = w / 2, c = d / 2;
    const v = [[x-a,y,z-c],[x+a,y,z-c],[x+a,y,z+c],[x-a,y,z+c],[x-a,y+h,z-c],[x+a,y+h,z-c],[x+a,y+h,z+c],[x-a,y+h,z+c]];
    const f = [[0,1,2],[0,2,3],[4,6,5],[4,7,6],[0,4,5],[0,5,1],[1,5,6],[1,6,2],[2,6,7],[2,7,3],[3,7,4],[3,4,0]];
    return { positions: f.flat().flatMap((i) => v[i]), color };
  };
  const file = (name, scene) => repo.add({ "@patchwork": { type: "file" }, name, extension: "glb", mimeType: "model/gltf-binary", content: encodeGLB(scene) });
  const snapPoints = [];
  for (let i = -2; i <= 2; i++) for (let j = -2; j <= 2; j++) snapPoints.push([i * 0.06, 0.04, j * 0.06]);
  const boardGLB = file("board.glb", { meshes: [box(0.32, 0.04, 0.32, "#78a656")], extras: { snapPoints } });
  const blockGLB = file("block.glb", { meshes: [box(0.05, 0.032, 0.05, "#f1ede3")] });
  const pawnGLB = file("pawn.glb", { meshes: [box(0.016, 0.03, 0.016, "#3a78d8")] });
  const obj = (name, glb, position, extra = {}) => ({ name, sourceUrl: glb.url, providerId: "file-glb", renderUrl: null, parent: null, visible: true, color: null, opacity: 1, wireframe: false, transform: { position, rotation: [0, 0, 0], scale: 1 }, ...extra });
  const objects = { board: obj("Board", boardGLB, [0, 0, 0], { locked: true }) };
  for (let i = 0; i < 4; i++) objects[`b${i}`] = obj(`Block ${i + 1}`, blockGLB, [0.25 + i * 0.06, 0, -0.1]);
  for (let i = 0; i < 2; i++) objects[`p${i}`] = obj(`Pawn ${i + 1}`, pawnGLB, [-0.04 + i * 0.08, 0, 0.25]);
  // hidden objects: a tray that is seat 1's private zone, and two cards that are really "Red 7"
  const trayGLB = file("tray.glb", { meshes: [box(0.2, 0.002, 0.08, "#2f4a3a")] });
  const backGLB = file("back.glb", { meshes: [box(0.04, 0.002, 0.06, "#6b3e26")] });
  const faceGLB = file("red-7.glb", { meshes: [box(0.04, 0.002, 0.06, "#c4452f")] });
  objects.tray = obj("Seat 1's tray", trayGLB, [-0.25, 0, 0.25], { locked: true });
  const blueGLB = file("blue-3.glb", { meshes: [box(0.04, 0.002, 0.06, "#2f6db5")] });
  const secret = (sourceUrl, name) => ({ traits: { "probe.secret": { sourceUrl, name } } });
  objects.inTray = obj("Card", backGLB, [-0.25, 0.002, 0.25], secret(faceGLB.url, "Red 7"));
  // a pile of two, face down, on the table: "under" and "faceDown" on top
  objects.under = obj("Card", backGLB, [0.25, 0.002, 0.15], secret(blueGLB.url, "Blue 3"));
  objects.under.transform.rotation = [0, 0, Math.PI];
  objects.faceDown = obj("Card", backGLB, [0.25, 0.004, 0.15], secret(faceGLB.url, "Red 7"));
  objects.faceDown.transform.rotation = [0, 0, Math.PI];

  // the probe's extension (STAGE.md's contract): who sits at the tray is the scene trait probe.seat
  const TRAY = { min: [-0.1, 0, -0.04], max: [0.1, 0.1, 0.04] };
  getRegistry("scene:extension").register({
    type: "scene:extension", id: "probe", name: "Probe", traits: ["probe.secret"],
    load: async () => ({
      create(api) {
        let looks = new Map();
        const scene = () => api.scene();
        const inTray = (p) => { const l = scene().toLocal("tray", p); return !!l && l.every((v, k) => v >= TRAY.min[k] - 1e-9 && v <= TRAY.max[k] + 1e-9); };
        const seated = () => scene()?.traits?.["probe.seat"] === api.viewer;
        const secretOf = (id) => scene()?.objects[id]?.traits?.["probe.secret"];
        return {
          update(s) {
            const next = new Map();
            for (const id of s.ids) {
              const sec = s.objects[id]?.traits?.["probe.secret"];
              if (!sec) continue;
              const m = s.world(id);
              if (inTray([m[12], m[13], m[14]]) ? seated() : m[5] > 1e-6) next.set(id, sec);
            }
            looks = next;
          },
          looks: () => looks,
          landing: (id, p) => (secretOf(id) && seated() && inTray(p) ? { faceUp: true } : null),
          commands: [{
            id: "shuffle", name: "Shuffle pile", key: "s",
            state: (id) => (id != null && secretOf(id) ? {} : null),
            run(id) {
              const s = scene();
              const at = s.world(id);
              const pile = s.ids.filter((x) => { const m = s.world(x); return secretOf(x) && Math.hypot(m[12] - at[12], m[14] - at[14]) < 0.005; });
              api.change((d) => {
                const secrets = pile.map((x) => ({ ...d.objects[x].traits["probe.secret"] }));
                secrets.push(secrets.shift());
                pile.forEach((x, i) => (d.objects[x].traits["probe.secret"] = secrets[i]));
              });
              api.notify(`Shuffling ${pile.length} cards…`);
            },
          }],
          panels: [{ id: "probe.panel", title: "Probe", mount(el) { el.textContent = "probe panel"; return { update() {}, dispose() {} }; } }],
        };
      },
    }),
  });
  const scene = repo.add({
    "@patchwork": { type: "scene" }, title: "Hand probe", objects, order: Object.keys(objects), dimensions: {},
    view: { units: "cm", grid: false, axes: false, bounds: false, snap: true, defaultMode: "hand" },
    camera: { position: [0.05, 0.55, 0.6], target: [0.05, 0, 0] },
  });
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const A = peer(scene), B = peer(scene);
  A.other = B; B.other = A;
  const hostA = document.getElementById("a"), hostB = document.getElementById("b");
  hostA.repo = repo; hostB.repo = repo;
  hostA.viewerId = "viewer:a"; hostB.viewerId = "viewer:b";
  Tool(A, hostA);
  const dbgA = hostA.querySelector(".scene-stage").__sceneDebug;
  Tool(B, hostB);
  const dbgB = hostB.querySelector(".scene-stage").__sceneDebug;
  const total = Object.values(scene.doc().objects).filter((o) => o.kind !== "group").length;
  for (let i = 0; i < 300; i++) {
    if (dbgA.stats().loaded === total && dbgB.stats().loaded === total) break;
    await sleep(50);
  }
  const vp = dbgA.viewport;
  const byName = (n) => Object.entries(scene.doc().objects).find(([, o]) => o.name === n)?.[0];
  const pageOf = (v, w) => { const p = v.project(w); const r = v.canvas.getBoundingClientRect(); return p && [r.left + p.x, r.top + p.y]; };
  window.__probeScene = scene;
  window.__table = {
    A: dbgA, B: dbgB, hostA, hostB,
    errors,
    total,
    loaded: () => [dbgA.stats().loaded, dbgB.stats().loaded],
    id: byName,
    /** page coords of a world point in viewport A */
    screen: (w) => pageOf(vp, w),
    /** page coords of the top centre of an object's box in A */
    top: (id) => {
      const b = vp.objectBox(id, { hints: false });
      return pageOf(vp, [(b.min.x + b.max.x) / 2, b.max.y - 0.0005, (b.min.z + b.max.z) / 2]);
    },
    pos: (id) => scene.doc().objects[id].transform.position,
    worldB: (id) => dbgB.viewport.worldOf(id)?.slice(12, 15) ?? null,
    carrying: () => dbgA.host.instanceOf("scene.hand") && dbgA.local.get().armed,
    camera: () => vp.getCamera(),
    /** "face" or "back": which look a viewer is showing for a hidden object */
    look: (who, id) => {
      const url = (who === "a" ? dbgA : dbgB).queue.state(id)?.url;
      return url === faceGLB.url || url === blueGLB.url ? "face" : url === backGLB.url ? "back" : url;
    },
    sit: (who) => scene.change((d) => {
      if (!d.traits) d.traits = {};
      d.traits["probe.seat"] = who === "a" ? hostA.viewerId : hostB.viewerId;
    }),
    panel: (who) => [...(who === "a" ? hostA : hostB).querySelectorAll(".sidebar section")].map((s) => s.textContent).find((t) => t.includes("probe panel")) ?? null,
    settled: () => dbgA.queue.pending() === 0 && dbgB.queue.pending() === 0,
    rot: (id) => scene.doc().objects[id].transform.rotation,
    /** what each card really is */
    secretNames: () => Object.fromEntries(Object.entries(scene.doc().objects).filter(([, o]) => o.traits?.["probe.secret"]).map(([id, o]) => [id, o.traits["probe.secret"].name])),
    toast: () => [...hostA.querySelectorAll(".toast")].map((e) => e.textContent).join(" | "),
    /** file both pawns in a new group */
    groupPawns() {
      const p0 = byName("Pawn 1"), p1 = byName("Pawn 2");
      scene.change((d) => {
        d.objects.pawns = { kind: "group", name: "Pawns", group: null, visible: true, opacity: 1 };
        d.order.push("pawns");
        d.objects[p0].group = "pawns";
        d.objects[p1].group = "pawns";
      });
      return [p0, p1];
    },
    row: (id) => { const e = hostA.querySelector(`.object-row[data-id="${id}"] .row-main`) ?? hostA.querySelector(`.object-row[data-id="${id}"]`); const r = e?.getBoundingClientRect(); return r && [r.x + Math.min(40, r.width / 2), r.y + r.height / 2]; },
    /** where the gizmo's proxy is (world) and the axis it's hovering */
    gizmo: () => { const g = dbgA.host.instanceOf("scene.gizmo")?.debug; if (!g?.tc || g.tc.object !== g.proxy) return null; g.proxy.updateMatrixWorld(); const e = g.proxy.matrixWorld.elements; return { at: [e[12], e[13], e[14]], axis: g.tc.axis ?? null, target: g.target }; },
    hover: (id) => {
      const b = vp.objectBox(id, { hints: false });
      return pageOf(vp, [(b.min.x + b.max.x) / 2, b.max.y, (b.min.z + b.max.z) / 2]);
    },
  };
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack || err}`);
  window.__ready = true;
}
</script>
