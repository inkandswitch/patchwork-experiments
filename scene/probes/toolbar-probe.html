<!doctype html>
<meta charset="utf-8">
<title>scene toolbar probe</title>
<!-- Driven by probes/toolbar-run.mjs: the BUILT scene tool (dist/) on one
     empty scene with a scene trait that runs this page's own extension (a
     `scene:extension` plugin, written to STAGE.md's command contract), a
     stand-in for a game's: two world commands (show: ["world"]), a button
     (Play, until playing) and a picker (Seat), so the bar of tools holds the
     world's cluster in every body. The runner measures the bar's layout in a
     real browser: what the unit tests can only read from the stylesheet. -->
<script type="importmap">
{ "imports": {
  "@inkandswitch/patchwork-plugins": "./plugins-stub.js",
  "@automerge/automerge": "./automerge-stub.js"
} }
</script>
<style>
  html, body { margin: 0; height: 100%; font: 13px system-ui, sans-serif; }
  #a { width: 1100px; height: 640px; position: relative; }
</style>
<div id="a"></div>
<script type="module">
import { getRegistry } from "@inkandswitch/patchwork-plugins";
import { FakeRepo } from "../src/test/fake-repo.js";
import { emptyScene } from "../src/test/empty-scene.js";

let time = null; // the page's manual clock (scene's manualTime): window.__time

const errors = [];
window.addEventListener("error", (e) => errors.push(`onerror: ${e.message}`));
window.addEventListener("unhandledrejection", (e) => errors.push(`rejection: ${e.reason?.stack || e.reason}`));

try {
  const { plugins, loadTime } = await import("../dist/index.js");
  for (const p of plugins) getRegistry(p.type).register(p);
  time = window.__time = (await loadTime()).manualTime();
  const ran = [];
  getRegistry("scene:extension").register({
    type: "scene:extension", id: "probe", name: "Probe", traits: ["probe.world"],
    load: async () => ({
      create(api) {
        return {
          commands: [
            { id: "play", name: "Play", show: ["world", "menu"], state: (t, { local }) => (t == null && !local.playing ? {} : null),
              run: () => (ran.push("play"), api.local.swap((m) => ({ ...m, playing: true }))) },
            { id: "seat", name: "Seat", show: ["world"],
              state: (t, { local }) => (t == null ? { value: local.seat ?? "north", choices: [{ value: "north", label: "North" }, { value: "south", label: "South" }] } : null),
              run: (_t, v) => (ran.push(["seat", v]), api.local.swap((m) => ({ ...m, seat: v }))) },
          ],
        };
      },
    }),
  });

  const repo = new FakeRepo();
  const scene = repo.add(emptyScene({
    title: "Toolbar probe", traits: { "probe.world": true },
    view: { units: "m", grid: true, axes: false, bounds: false, snap: true, start: { body: "look", home: { position: [3, 3, 3], target: [0, 0, 0] } } },
  }));
  try { localStorage.clear(); } catch {}
  const Tool = (await getRegistry("patchwork:tool").load("scene")).module;
  const host = document.getElementById("a");
  host.repo = repo;
  host.time = time;
  Tool(scene, host);
  const dbg = host.querySelector(".scene-stage").__sceneDebug;
  const rect = (e) => { if (!e) return null; const r = e.getBoundingClientRect(); return { x: r.x, y: r.y, w: r.width, h: r.height, right: r.right, bottom: r.bottom }; };
  const bar = () => host.querySelector(".toolbar");
  window.__p = {
    dbg, host, errors, ran,
    body: () => dbg.local.get().body?.id ?? null,
    enter: (id) => dbg.host.record("scene.body")?.api.body.enter(id, null) ?? false,
    /** pick up the editor or put it down, as the body chip's Edit does (api.view.edit) */
    edit: (on) => dbg.host.record("scene.body")?.api.view.edit(on) ?? false,
    editing: () => (dbg.local.get().hands ?? []).some((h) => h.kind === "edit"),
    unplay: () => dbg.local.swap((m) => ({ ...m, playing: false })),
    width: (px) => { host.style.width = `${px}px`; },
    /** the bar: shown, its box, each cluster's commands, each control's box, and whether the editor's cluster overflows */
    bar: () => {
      const b = bar();
      if (!b) return null;
      const edge = b.closest(".stage-edge-part") ?? b.parentElement;
      const ids = (sel) => [...b.querySelectorAll(`${sel} [data-command]`)].map((e) => e.dataset.command);
      const tools = b.querySelector(".tools");
      const controls = [...b.querySelectorAll("[data-command]")].map((e) => {
        const r = rect(e);
        // in view: inside the bar's box, and what's really there at its middle
        const at = document.elementFromPoint(r.x + r.w / 2, r.y + r.h / 2);
        return { id: e.dataset.command, tag: e.tagName, ...r, inView: r.x >= rect(b).x - 0.5 && r.right <= rect(b).right + 0.5 && (at === e || e.contains(at)) };
      });
      return { hidden: !!edge.hidden || b.offsetParent === null, rect: rect(b), tools: ids(".tools"), world: ids(".world"), worldRect: rect(b.querySelector(".world")), controls,
        overflows: tools.scrollWidth > tools.clientWidth + 1, control: parseFloat(getComputedStyle(b.querySelector(".world")).minHeight) };
    },
    canvas: () => rect(dbg.viewport.canvas),
    focusInBar: () => !!document.activeElement?.closest?.(".toolbar"),
    playing: () => !!dbg.local.get().playing,
  };
  window.__ready = true;
} catch (err) {
  errors.push(`setup: ${err?.stack ?? err}`);
  window.__ready = "failed";
  window.__p = { errors };
}
</script>
