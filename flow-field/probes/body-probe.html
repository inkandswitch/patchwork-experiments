<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>flow-field body probe</title>
<script type="importmap">
  { "imports": { "@inkandswitch/patchwork-plugins": "../src/test/patchwork-plugins-stub.js" } }
</script>
<style>
  html, body { margin: 0; height: 100%; }
  #host { width: 1200px; height: 700px; }
</style>
</head>
<body>
<div id="host"></div>
<script type="module">
  // Mounts the built editor with a body linked, against a stub plugin
  // registry and an in-memory repo. Serve the package root:
  //   node probes/probe-server.mjs . 8765   →   http://localhost:8765/probes/body-probe.html
  // ?path=source             (default) a doc a scene:source provider builds; its GLB is cut
  // ?path=render             a scene-render doc whose GLB file is cut
  // ?path=file               a GLB file doc, cut as it is (no provider at all)
  // ?model=slender-body-3d   the 3D model instead of the waterplane panels
  // ?fixture=<name>          with path=file: the file is src/test/fixtures/<name> (e.g. a meshopt GLB)
  // ?z=0.5                   the editor's height slider
  // document.title becomes "ready <path>" once the section is in.
  // A geometry:section provider is registered too: the flow must ignore it.
  import { getRegistry } from "@inkandswitch/patchwork-plugins";
  import { plugins } from "../dist/index.js";
  import { transomWaterline, prismGLB } from "../src/test/hull-fixtures.js";
  const q = new URLSearchParams(location.search);
  const path = q.get("path") ?? "source";
  const HULL = "automerge:hu11111111111111111111111";
  const GLB = "automerge:g1b1111111111111111111111";

  function memHandle(url, doc) {
    const listeners = new Set();
    let cur = doc;
    return {
      url,
      doc: () => cur,
      change(fn) { const n = structuredClone(cur); fn(n); cur = n; listeners.forEach((l) => l({ doc: cur })); },
      on(e, f) { if (e === "change") listeners.add(f); },
      off(e, f) { listeners.delete(f); },
    };
  }
  const loop = (k) => transomWaterline(60).map(([x, y]) => [x * k, y * k]);
  const glbFile = (name) => ({ "@patchwork": { type: "file" }, name, extension: "glb", mimeType: "model/gltf-binary", content: prismGLB(loop(1), { levels: [-1.2, 0.4] }) });
  const fixture = q.get("fixture");
  const fixtureBytes = fixture ? new Uint8Array(await (await fetch(`../src/test/fixtures/${fixture}`)).arrayBuffer()) : null;
  const hull =
    fixtureBytes
      ? memHandle(HULL, { "@patchwork": { type: "file" }, name: fixture, extension: "glb", content: fixtureBytes })
      : path === "render"
      ? memHandle(HULL, { "@patchwork": { type: "scene-render" }, title: "Probe hull", parent: "automerge:src", providerId: "probe-hull-surface", glbUrl: GLB, status: "idle", error: null })
      : path === "file"
        ? memHandle(HULL, glbFile("Probe hull.glb"))
        : memHandle(HULL, { "@patchwork": { type: "probe-hull" }, title: "Probe hull", scale: 1 });
  const glb = memHandle(GLB, glbFile("render.glb"));
  window.hull = hull;
  window.repo = { find: async (url) => (url === HULL ? hull : url === GLB ? glb : Promise.reject(new Error("unavailable"))) };
  window.sectionCalls = 0;
  getRegistry("geometry:section").register({
    type: "geometry:section", id: "probe-hull-section", name: "Probe hull section", supportedDatatypes: ["probe-hull"], planes: ["waterline", "z"],
    async load() { window.sectionCalls++; return { section: () => { window.sectionCalls++; return { loops: [] }; } }; },
  });
  if (path === "source") {
    getRegistry("scene:source").register({
      type: "scene:source", id: "probe-hull-surface", name: "Probe hull", supportedDatatypes: ["probe-hull"], params: [],
      async load() { return { build: async ({ doc }) => ({ kind: "glb", glb: prismGLB(loop(doc.scale), { levels: [-1.2, 0.4] }) }) }; },
    });
  }

  const dt = await plugins.find((p) => p.type === "patchwork:datatype").load();
  const Tool = await plugins.find((p) => p.type === "patchwork:tool").load();
  const doc = {};
  dt.init(doc);
  doc.elements = {};
  doc.freestream.headingDeg = 180;
  doc.domain = { min: [-5, -4, -3], max: [15, 4, 1] };
  doc.body = { url: HULL, plane: { kind: "waterline" }, model: q.get("model") ?? "waterplane-2d", panels: 120 };
  const handle = memHandle("automerge:flowprobe", doc);
  window.handle = handle;
  Tool(handle, document.getElementById("host"));
  if (q.get("z")) {
    const r = document.querySelector('[aria-label="Slice height"]');
    r.value = q.get("z");
    r.dispatchEvent(new Event("input"));
  }
  const t0 = performance.now();
  for (let i = 0; i < 200; i++) {
    const path = document.querySelector(".chip-path")?.textContent ?? "";
    if (/scene render|GLB file|built from|no section/.test(path)) break;
    await new Promise((r) => setTimeout(r, 20));
  }
  await new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));
  document.title = `ready ${document.querySelector(".chip-path")?.textContent} ${(performance.now() - t0).toFixed(0)}ms sectionCalls=${window.sectionCalls}`;
  window.__probeCleanup = true;
  // served by probes/probe-server.mjs: post what the panel says, so a headless run can read it
  fetch("/report", {
    method: "POST",
    body: JSON.stringify({ path, title: document.title, chip: document.querySelector(".chip-path")?.textContent, status: document.querySelector(".body-status")?.textContent, sectionCalls: window.sectionCalls }),
  }).catch(() => {});
</script>
</body>
</html>
